<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ALPEN — 3D Downhill Skiing</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #235ea8;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    touch-action: none;
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Subtle dynamic wind-speed edge overlay */
  #speed-lines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s ease;
    background:
      radial-gradient(ellipse 68% 68% at 50% 52%, transparent 56%, rgba(235, 247, 255, 0.24) 100%);
    z-index: 4;
  }

  #damage-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(226, 62, 42, 0.42) 100%);
    z-index: 5;
    transition: opacity 0.08s ease;
  }

  /* Soft vignette only subtle for sky depth */
  #ui-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* ---- TITLE OVERLAY: Floating clean editorial lockup directly over sky ---- */
  #title-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(34px, 7vh, 72px) 24px clamp(26px, 5.5vh, 52px);
    pointer-events: auto;
    transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #title-screen.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-16px);
  }

  .title-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: clamp(0px, 1.5vh, 18px);
  }

  .title-wordmark {
    font-size: clamp(3.4rem, 10.5vw, 7.2rem);
    font-weight: 800;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    line-height: 0.96;
    color: #ffffff;
    text-shadow:
      0 2px 24px rgba(15, 42, 84, 0.34),
      0 8px 44px rgba(13, 38, 76, 0.22);
  }

  .title-sub {
    margin-top: 12px;
    font-size: clamp(0.7rem, 1.4vw, 0.88rem);
    font-weight: 600;
    letter-spacing: 0.44em;
    text-indent: 0.44em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 1px 12px rgba(15, 42, 84, 0.42);
  }

  .title-best {
    margin-top: 14px;
    font-size: 0.74rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 245, 215, 0.92);
    text-shadow: 0 1px 10px rgba(12, 34, 68, 0.46);
    min-height: 1em;
  }

  .title-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn-play {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 16px 56px;
    border-radius: 999px;
    background: #ffffff;
    color: #10243e;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 800;
    letter-spacing: 0.26em;
    text-indent: 0.26em;
    text-transform: uppercase;
    box-shadow:
      0 14px 36px rgba(12, 32, 66, 0.28),
      0 2px 6px rgba(12, 32, 66, 0.14),
      inset 0 -2px 0 rgba(16, 36, 62, 0.08);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background 0.18s ease, color 0.18s ease;
  }

  .btn-play:hover {
    transform: translateY(-2px) scale(1.03);
    background: #e94b28;
    color: #ffffff;
    box-shadow:
      0 18px 42px rgba(233, 75, 40, 0.42),
      0 3px 10px rgba(12, 32, 66, 0.2);
  }

  .btn-play:active {
    transform: translateY(1px) scale(0.98);
  }

  .controls-whisper {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 10px rgba(12, 32, 66, 0.52);
    text-align: center;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(13, 35, 68, 0.22);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  /* ---- MINIMAL LIVE GAMEPLAY HUD ---- */
  #hud {
    position: absolute;
    inset: 0;
    padding: clamp(16px, 2.8vw, 30px);
    opacity: 0;
    transition: opacity 0.38s ease;
    pointer-events: none;
  }

  #hud.visible {
    opacity: 1;
  }

  .hud-top-left {
    position: absolute;
    top: clamp(16px, 2.8vw, 28px);
    left: clamp(18px, 3vw, 34px);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .hud-score-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .hud-score {
    font-size: clamp(2rem, 4.4vw, 3.1rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 2px 14px rgba(11, 33, 66, 0.38), 0 1px 2px rgba(11, 33, 66, 0.45);
  }

  .hud-mult {
    font-size: clamp(0.95rem, 1.8vw, 1.2rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #fff;
    background: #e94b28;
    padding: 3px 10px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(233, 75, 40, 0.42);
    transform: scale(0.8);
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .hud-mult.active {
    opacity: 1;
    transform: scale(1);
  }

  .hud-mult.pop {
    transform: scale(1.22);
  }

  .hud-combo-bar {
    width: 112px;
    height: 3px;
    margin-top: 7px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.22);
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .hud-combo-bar.active {
    opacity: 1;
  }

  .hud-combo-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ffbe4d, #e94b28);
    transform-origin: left center;
    transform: scaleX(1);
  }

  .hud-top-right {
    position: absolute;
    top: clamp(16px, 2.8vw, 28px);
    right: clamp(18px, 3vw, 34px);
    display: flex;
    align-items: center;
    gap: 14px;
    pointer-events: auto;
  }

  .lives-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-right: 4px;
  }

  .life-pip {
    width: 11px;
    height: 11px;
    transform: rotate(45deg);
    border-radius: 2px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(11, 33, 66, 0.35);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.28s ease, background 0.28s ease;
  }

  .life-pip.lost {
    background: rgba(255, 255, 255, 0.26);
    transform: rotate(45deg) scale(0.68);
    box-shadow: none;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.32);
    background: rgba(14, 38, 74, 0.22);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #ffffff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.18s ease;
  }

  .icon-btn:hover {
    background: rgba(14, 38, 74, 0.42);
    transform: scale(1.06);
  }

  .icon-btn svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Floating corner sound btn visible on title screen too */
  #global-sound-btn {
    position: fixed;
    top: clamp(16px, 2.8vw, 28px);
    right: clamp(18px, 3vw, 34px);
    z-index: 30;
    pointer-events: auto;
  }

  .hud-bottom-right {
    position: absolute;
    bottom: clamp(18px, 3vw, 30px);
    right: clamp(18px, 3vw, 34px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }

  .hud-speed {
    font-size: clamp(1.7rem, 3.6vw, 2.4rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 2px 14px rgba(10, 32, 66, 0.44);
  }

  .hud-speed span {
    font-size: 0.42em;
    font-weight: 700;
    letter-spacing: 0.14em;
    opacity: 0.85;
    margin-left: 3px;
  }

  .hud-dist {
    font-size: 0.82rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 10px rgba(10, 32, 66, 0.5);
  }

  /* Transient sky-level floating callouts for tricks, tight lines, and zones */
  #callout {
    position: absolute;
    left: 50%;
    top: 20%;
    transform: translate(-50%, 8px);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.24s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #callout.show {
    opacity: 1;
    transform: translate(-50%, -8px);
  }

  .callout-main {
    font-size: clamp(1.3rem, 3vw, 2.05rem);
    font-weight: 800;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 3px 20px rgba(12, 34, 68, 0.5);
  }

  .callout-main.gold {
    color: #ffe38e;
    text-shadow: 0 3px 22px rgba(120, 62, 8, 0.55);
  }

  .callout-sub {
    margin-top: 3px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 1px 12px rgba(12, 34, 68, 0.5);
  }

  /* Zone transition editorial whisper */
  #zone-banner {
    position: absolute;
    left: 50%;
    top: 12%;
    transform: translate(-50%, 0);
    text-align: center;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }

  #zone-banner.show {
    opacity: 1;
  }

  #zone-banner .z-label {
    font-size: clamp(0.95rem, 2.2vw, 1.35rem);
    font-weight: 800;
    letter-spacing: 0.36em;
    text-indent: 0.36em;
    color: #fff;
    text-shadow: 0 2px 18px rgba(10, 28, 60, 0.48);
    text-transform: uppercase;
  }

  #zone-banner .z-line {
    width: 44px;
    height: 2px;
    background: rgba(255, 255, 255, 0.78);
    margin: 7px auto 0;
  }

  /* ---- PAUSE & GAMEOVER COMPACT REFINED PANELS ---- */
  .modal-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(11, 28, 56, 0.28);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .modal-screen.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-title {
    font-size: clamp(2rem, 6vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 4px 28px rgba(8, 22, 46, 0.45);
  }

  .modal-badge {
    margin-top: 8px;
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #ffe285;
    min-height: 1.1em;
    text-shadow: 0 1px 10px rgba(8, 22, 46, 0.45);
  }

  .stats-strip {
    margin: 28px 0 34px;
    display: grid;
    grid-template-columns: repeat(4, minmax(76px, 118px));
    gap: 12px;
    text-align: center;
  }

  .stat-cell {
    padding: 14px 10px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.26);
  }

  .stat-val {
    font-size: clamp(1.25rem, 2.8vw, 1.75rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
    line-height: 1.1;
  }

  .stat-key {
    margin-top: 5px;
    font-size: 0.64rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.76);
  }

  .modal-hint {
    margin-top: 14px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
  }

  /* Touch-only subtle jump tap button */
  #touch-jump {
    display: none;
    position: absolute;
    bottom: 24px;
    left: 22px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.45);
    background: rgba(16, 40, 76, 0.24);
    backdrop-filter: blur(5px);
    color: #fff;
    font-size: 0.64rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    pointer-events: auto;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  #touch-jump:active {
    background: rgba(233, 75, 40, 0.68);
    transform: scale(0.94);
  }

  @media (pointer: coarse) {
    #touch-jump {
      display: flex;
    }
  }

  @media (max-width: 560px) {
    .stats-strip {
      grid-template-columns: repeat(2, minmax(112px, 140px));
    }
    .btn-play {
      padding: 15px 46px;
    }
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="speed-lines"></div>
<div id="damage-flash"></div>

<button id="global-sound-btn" class="icon-btn" aria-label="Toggle sound" title="Sound (M)">
  <svg id="sound-icon-on" viewBox="0 0 24 24">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
  </svg>
  <svg id="sound-icon-off" viewBox="0 0 24 24" style="display:none">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <line x1="23" y1="9" x2="17" y2="15"></line>
    <line x1="17" y1="9" x2="23" y2="15"></line>
  </svg>
</button>

<div id="ui-layer">
  <!-- Title Screen -->
  <div id="title-screen">
    <div class="title-hero">
      <div class="title-wordmark">ALPEN</div>
      <div class="title-sub">Downhill Carving</div>
      <div class="title-best" id="title-best"></div>
    </div>
    <div class="title-actions">
      <button id="btn-play" class="btn-play">Ski</button>
      <div class="controls-whisper" id="controls-whisper">A / D Carve &nbsp;&middot;&nbsp; W Tuck &nbsp;&middot;&nbsp; S Brake &nbsp;&middot;&nbsp; Space Jump &amp; Tricks</div>
    </div>
  </div>

  <!-- Minimal Active Gameplay HUD -->
  <div id="hud">
    <div class="hud-top-left">
      <div class="hud-score-row">
        <div class="hud-score" id="hud-score">0</div>
        <div class="hud-mult" id="hud-mult">&times;2</div>
      </div>
      <div class="hud-combo-bar" id="hud-combo-bar">
        <div class="hud-combo-fill" id="hud-combo-fill"></div>
      </div>
    </div>

    <div class="hud-top-right" style="padding-right: 50px;">
      <div class="lives-row" id="lives-row">
        <div class="life-pip"></div>
        <div class="life-pip"></div>
        <div class="life-pip"></div>
      </div>
      <button id="btn-pause" class="icon-btn" aria-label="Pause" title="Pause (P)">
        <svg viewBox="0 0 24 24">
          <line x1="9" y1="5" x2="9" y2="19"></line>
          <line x1="15" y1="5" x2="15" y2="19"></line>
        </svg>
      </button>
    </div>

    <div class="hud-bottom-right">
      <div class="hud-speed" id="hud-speed">0<span>KM/H</span></div>
      <div class="hud-dist" id="hud-dist">0 M</div>
    </div>

    <div id="zone-banner">
      <div class="z-label" id="zone-label">Summit Ridge</div>
      <div class="z-line"></div>
    </div>

    <div id="callout">
      <div class="callout-main" id="callout-main"></div>
      <div class="callout-sub" id="callout-sub"></div>
    </div>

    <button id="touch-jump">Jump</button>
  </div>

  <!-- Pause Overlay -->
  <div id="pause-screen" class="modal-screen">
    <div class="modal-title">Paused</div>
    <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <button id="btn-resume" class="btn-play">Resume</button>
      <button id="btn-pause-restart" style="background:none;border:none;color:rgba(255,255,255,0.82);font:700 0.76rem/1 inherit;letter-spacing:0.24em;text-transform:uppercase;cursor:pointer;padding:8px 16px;">Restart Run</button>
    </div>
    <div class="modal-hint">Press P or Space to resume</div>
  </div>

  <!-- Run Finished Overlay -->
  <div id="gameover-screen" class="modal-screen">
    <div class="modal-title">Run Over</div>
    <div class="modal-badge" id="go-badge"></div>
    <div class="stats-strip">
      <div class="stat-cell">
        <div class="stat-val" id="go-score">0</div>
        <div class="stat-key">Score</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="go-dist">0m</div>
        <div class="stat-key">Distance</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="go-speed">0</div>
        <div class="stat-key">Top km/h</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="go-gates">0</div>
        <div class="stat-key">Gates</div>
      </div>
    </div>
    <button id="btn-retry" class="btn-play">Ski Again</button>
    <div class="modal-hint">Press Space or Enter</div>
  </div>
</div>

<!-- Three.js r128 UMD with automatic fallback CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';document.head.appendChild(s);"></script>

<script>
(function () {
  'use strict';

  function bootWhenReady() {
    if (typeof window.THREE === 'undefined') {
      setTimeout(bootWhenReady, 40);
      return;
    }
    initGame(window.THREE);
  }
  bootWhenReady();

  function initGame(THREE) {
    /* ================================================================
       CONSTANTS & MATH HELPERS
       ================================================================ */
    const SLOPE_TAN = 0.275;         // ~15.4° exhilarating steady alpine pitch
    const PISTE_HALF = 17.5;         // Clean sunlit wide carved run half-width
    const MAX_X_OFFSET = 30.0;       // Soft valley wall limit beyond deep snow edge
    const CHUNK_LEN = 38;            // World streaming length per segment
    const STORAGE_KEY = 'alpen_ski_best_v1';

    const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
    const lerp = (a, b, t) => a + (b - a) * t;
    const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
    const smoothstep = (e0, e1, x) => {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    };

    // Deterministic fast hash RNG for seeded procedural mountain variation
    function createRng(seed) {
      let s = (seed >>> 0) || 1;
      return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function loadBest() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : { score: 0, dist: 0 };
      } catch (e) {
        return { score: 0, dist: 0 };
      }
    }
    function saveBest(score, dist) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ score: Math.floor(score), dist: Math.floor(dist) }));
      } catch (e) {}
    }

    /* ================================================================
       ALPINE ATMOSPHERE ZONES (Dynamic Lighting & Palette Grading)
       ================================================================ */
    const ZONES = [
      {
        name: 'Summit Ridge',
        skyTop: new THREE.Color('#1958aa'),
        skyMid: new THREE.Color('#5daae9'),
        skyHorizon: new THREE.Color('#e2f1fc'),
        sunColor: new THREE.Color('#fff6e4'),
        sunDir: new THREE.Vector3(-0.56, 0.50, -0.66).normalize(),

    /* ================================================================
       PROCEDURAL WEB AUDIO ENGINE (Ski Carve, Wind, Bell Chimes, FX)
       ================================================================ */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.started = false;
        this.master = null;
        this.carveGain = null;
        this.carveFilter = null;
        this.biteGain = null;
        this.biteFilter = null;
        this.windGain = null;
        this.windFilter = null;
        this.noiseBuf = null;
        // Bright crisp alpine major pentatonic Hz
        this.scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98];
      }

      unlock() {
        if (this.started) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return;
        }
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = this.muted ? 0 : 0.48;
          this.master.connect(this.ctx.destination);

          // Pink-ish crisp textured snow noise buffer (3s loop)
          const len = this.ctx.sampleRate * 3;
          const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = buf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0;
          for (let i = 0; i < len; i++) {
            const w = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + w * 0.0555179;
            b1 = 0.99332 * b1 + w * 0.0750759;
            b2 = 0.96900 * b2 + w * 0.1538520;
            b3 = 0.86650 * b3 + w * 0.3104856;
            b4 = 0.55000 * b4 + w * 0.5329522;
            b5 = -0.7616 * b5 - w * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + w * 0.5362) * 0.095;
          }
          this.noiseBuf = buf;

          // Continuous base ski-glide snow whisper
          const glideSrc = this.ctx.createBufferSource();
          glideSrc.buffer = buf;
          glideSrc.loop = true;
          this.carveFilter = this.ctx.createBiquadFilter();
          this.carveFilter.type = 'bandpass';
          this.carveFilter.frequency.value = 1100;
          this.carveFilter.Q.value = 0.7;
          this.carveGain = this.ctx.createGain();
          this.carveGain.gain.value = 0.0;
          glideSrc.connect(this.carveFilter);
          this.carveFilter.connect(this.carveGain);
          this.carveGain.connect(this.master);
          glideSrc.start();

          // Sharp carving steel-edge crunch layered on deep turns & brakes
          const biteSrc = this.ctx.createBufferSource();
          biteSrc.buffer = buf;
          biteSrc.loop = true;
          this.biteFilter = this.ctx.createBiquadFilter();
          this.biteFilter.type = 'highpass';
          this.biteFilter.frequency.value = 1900;
          this.biteGain = this.ctx.createGain();
          this.biteGain.gain.value = 0.0;
          biteSrc.connect(this.biteFilter);
          this.biteFilter.connect(this.biteGain);
          this.biteGain.connect(this.master);
          biteSrc.start();

          // Crisp alpine mountain wind rush
          const windSrc = this.ctx.createBufferSource();
          windSrc.buffer = buf;
          windSrc.loop = true;
          this.windFilter = this.ctx.createBiquadFilter();
          this.windFilter.type = 'bandpass';
          this.windFilter.frequency.value = 340;
          this.windFilter.Q.value = 1.6;
          this.windGain = this.ctx.createGain();
          this.windGain.gain.value = 0.0;
          windSrc.connect(this.windFilter);
          this.windFilter.connect(this.windGain);
          this.windGain.connect(this.master);
          windSrc.start();

          this.started = true;
        } catch (e) {}
      }

      setMuted(m) {
        this.muted = m;
        if (this.master && this.ctx) {
          this.master.gain.setTargetAtTime(m ? 0 : 0.48, this.ctx.currentTime, 0.04);
        }
      }

      updateContinuous(speedNorm, carveAmt, braking, grounded, active, dt) {
        if (!this.started || !this.ctx || this.ctx.state !== 'running') return;
        const t = this.ctx.currentTime;
        if (!active) {
          this.carveGain.gain.setTargetAtTime(0, t, 0.1);
          this.biteGain.gain.setTargetAtTime(0, t, 0.1);
          this.windGain.gain.setTargetAtTime(0.06, t, 0.2);
          this.windFilter.frequency.setTargetAtTime(300, t, 0.2);
          return;
        }
        const gVol = grounded ? clamp(speedNorm * 0.34, 0, 0.42) : 0;
        const cAmt = grounded ? clamp(carveAmt + (braking ? 0.85 : 0), 0, 1.3) : 0;
        const biteVol = grounded ? clamp(cAmt * (0.14 + speedNorm * 0.38), 0, 0.56) : 0;
        const windVol = clamp((grounded ? 0.08 : 0.22) + speedNorm * speedNorm * 0.36, 0, 0.5);

        this.carveGain.gain.setTargetAtTime(gVol, t, 0.05);
        this.carveFilter.frequency.setTargetAtTime(780 + speedNorm * 1350 + cAmt * 650, t, 0.05);
        this.biteGain.gain.setTargetAtTime(biteVol, t, 0.045);
        this.biteFilter.frequency.setTargetAtTime(braking ? 1550 : 2100 + cAmt * 900, t, 0.05);
        this.windGain.gain.setTargetAtTime(windVol, t, 0.08);
        this.windFilter.frequency.setTargetAtTime((grounded ? 290 : 460) + speedNorm * 580, t, 0.08);
      }

      playGate(combo, tight) {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const idx = Math.min(combo - 1, this.scale.length - 1);
        const freq = this.scale[Math.max(0, idx)];
        const playTone = (f, delay, dur, vol) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t + delay);
          const osc2 = this.ctx.createOscillator();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(f * 2, t + delay);
          const g2 = this.ctx.createGain();
          g2.gain.setValueAtTime(0.16, t + delay);
          g2.gain.exponentialRampToValueAtTime(0.001, t + delay + dur * 0.5);

          gain.gain.setValueAtTime(0.0001, t + delay);
          gain.gain.linearRampToValueAtTime(vol, t + delay + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + delay + dur);

          osc.connect(gain);
          osc2.connect(g2);
          g2.connect(gain);
          gain.connect(this.master);
          osc.start(t + delay);
          osc2.start(t + delay);
          osc.stop(t + delay + dur + 0.02);
          osc2.stop(t + delay + dur + 0.02);
        };
        playTone(freq, 0, 0.42, 0.26);
        if (tight) playTone(freq * 1.5, 0.055, 0.36, 0.16);
      }

      playRing() {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t + i * 0.052);
          g.gain.setValueAtTime(0.001, t + i * 0.052);
          g.gain.linearRampToValueAtTime(0.22, t + i * 0.052 + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.052 + 0.45);
          osc.connect(g);
          g.connect(this.master);
          osc.start(t + i * 0.052);
          osc.stop(t + i * 0.052 + 0.48);
        });
      }

      playJump(isRamp) {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        // Crisp ski snap + soft airy whoosh
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.setValueAtTime(620, t);
        flt.frequency.exponentialRampToValueAtTime(isRamp ? 2200 : 1500, t + 0.18);
        flt.Q.value = 1.2;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(isRamp ? 0.42 : 0.25, t + 0.025);
        g.gain.exponentialRampToValueAtTime(0.001, t + (isRamp ? 0.28 : 0.18));
        src.connect(flt);
        flt.connect(g);
        g.connect(this.master);
        src.start(t);
        src.stop(t + 0.32);

        if (isRamp) {
          const osc = this.ctx.createOscillator();
          const og = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, t);
          osc.frequency.exponentialRampToValueAtTime(520, t + 0.18);
          og.gain.setValueAtTime(0.11, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(og);
          og.connect(this.master);
          osc.start(t);
          osc.stop(t + 0.24);
        }
      }

      playLand(impact, withTrick) {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        // Fluffy powder crunch + weighted low thud
        const osc = this.ctx.createOscillator();
        const og = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(125, t);
        osc.frequency.exponentialRampToValueAtTime(42, t + 0.15);
        og.gain.setValueAtTime(clamp(impact * 0.34, 0.1, 0.42), t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(og);
        og.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.2);

        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.setValueAtTime(1500, t);
        flt.frequency.exponentialRampToValueAtTime(620, t + 0.24);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(clamp(impact * 0.55, 0.16, 0.62), t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        src.connect(flt);
        flt.connect(g);
        g.connect(this.master);
        src.start(t);
        src.stop(t + 0.3);

        if (withTrick) {
          [659.25, 880, 1318.5].forEach((f, i) => {
            const o = this.ctx.createOscillator();
            const tg = this.ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, t + i * 0.045);
            tg.gain.setValueAtTime(0.001, t + i * 0.045);
            tg.gain.linearRampToValueAtTime(0.18, t + i * 0.045 + 0.012);
            tg.gain.exponentialRampToValueAtTime(0.001, t + i * 0.045 + 0.38);
            o.connect(tg);
            tg.connect(this.master);
            o.start(t + i * 0.045);
            o.stop(t + i * 0.045 + 0.4);
          });
        }
      }

      playGateTap() {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, t);
        osc.frequency.exponentialRampToValueAtTime(155, t + 0.065);
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(g);
        g.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.09);
      }

      playCrash() {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        // Heavy snowy impact rumble
        const osc = this.ctx.createOscillator();
        const og = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(115, t);
        osc.frequency.exponentialRampToValueAtTime(34, t + 0.34);
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 260;
        og.gain.setValueAtTime(0.45, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.connect(lp);
        lp.connect(og);
        og.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.4);

        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.setValueAtTime(2400, t);
        flt.frequency.exponentialRampToValueAtTime(340, t + 0.48);
        const ng = this.ctx.createGain();
        ng.gain.setValueAtTime(0.7, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        src.connect(flt);
        flt.connect(ng);
        ng.connect(this.master);
        src.start(t);
        src.stop(t + 0.52);
      }

      playZoneChime() {
        if (!this.started || this.muted || !this.ctx) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f, t + i * 0.08);
          g.gain.setValueAtTime(0.001, t + i * 0.08);
          g.gain.linearRampToValueAtTime(0.14, t + i * 0.08 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.08 + 0.72);
          o.connect(g);
          g.connect(this.master);
          o.start(t + i * 0.08);
          o.stop(t + i * 0.08 + 0.76);
        });
      }

    /* ================================================================
       ANALYTICAL MOUNTAIN TERRAIN (Shared Single Source of Truth)
       ================================================================ */
    let worldSeedOffset = 0;

    function getCenterX(z) {
      const s = z + worldSeedOffset;
      return Math.sin(s * 0.0062) * 26 + Math.sin(s * 0.0027 + 1.1) * 20;
    }

    function getCenterSlopeX(z) {
      const s = z + worldSeedOffset;
      return Math.cos(s * 0.0062) * 26 * 0.0062 + Math.cos(s * 0.0027 + 1.1) * 20 * 0.0027;
    }

    function getTerrainHeight(x, z) {
      const s = z + worldSeedOffset;
      // Primary constant thrilling mountain descent (smaller z = lower mountain)
      const base = z * SLOPE_TAN;
      // Graceful rolling alpine crests & speed dips (softened gently near spawn)
      const fadeIn = smoothstep(5, -65, z);
      const roll = (
        Math.sin(s * 0.020) * 3.1 +
        Math.sin(s * 0.0085 + 0.9) * 5.8 +
        Math.cos(s * 0.043 + 0.4) * 0.55
      ) * fadeIn;

      // Cross-piste subtle banked bowl + rising sweeping side mountain ridges
      const cx = getCenterX(z);
      const dx = x - cx;
      const adx = Math.abs(dx);
      let side = (dx * dx) * 0.0036;
      if (adx > PISTE_HALF) {
        const over = adx - PISTE_HALF;
        const undul = 1 + 0.22 * Math.sin(s * 0.024 + (dx > 0 ? 0.5 : 2.9));
        side += Math.pow(over, 1.52) * 0.17 * undul;
        // High outer sculptural peaks along deep flanks
        if (over > 18) {
          const far = over - 18;
          side += far * far * 0.0065 * (0.7 + 0.38 * Math.sin(s * 0.037 + x * 0.05));
        }
      }
      // Subtle groomed surface undulation only outside direct center
      const micro = Math.sin(x * 0.09 + s * 0.05) * 0.18 * smoothstep(6, 22, adx);
      return base + roll + side + micro;
    }

    const _nTmp = new THREE.Vector3();
    function getTerrainNormal(x, z, target) {
      const e = 0.65;
      const hL = getTerrainHeight(x - e, z);
      const hR = getTerrainHeight(x + e, z);
      const hD = getTerrainHeight(x, z - e);
      const hU = getTerrainHeight(x, z + e);
      const out = target || _nTmp;
      return out.set(hL - hR, 2 * e, hD - hU).normalize();
    }

    /* ================================================================
       PROCEDURAL TEXTURES (Snow Corduroy, Soft Puff, Sparkle, Chevron)
       ================================================================ */
    function makeSnowTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#fbfdff';
      g.fillRect(0, 0, 256, 256);

      // Subtle authentic freshly groomed snowcat corduroy strips running downhill
      for (let x = 0; x < 256; x += 4) {
        const shade = (x % 8 === 0) ? 'rgba(182, 206, 234, 0.26)' : 'rgba(255, 255, 255, 0.35)';
        g.fillStyle = shade;
        g.fillRect(x, 0, 2, 256);
      }
      // Delicate natural grain & frosty flecks so speed pops sharply against white
      for (let i = 0; i < 4200; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const bright = Math.random() > 0.42;
        g.fillStyle = bright ? 'rgba(255,255,255,0.42)' : 'rgba(165,194,226,0.18)';
        g.fillRect(x, y, 1 + Math.random() * 1.8, 1 + Math.random() * 4.2);
      }
      // Faint natural crosswind snow-drift ripples
      g.strokeStyle = 'rgba(188, 212, 238, 0.14)';
      g.lineWidth = 2;
      for (let i = 0; i < 16; i++) {
        const y = Math.random() * 256;
        g.beginPath();
        g.moveTo(0, y);
        g.bezierCurveTo(85, y + 6, 170, y - 6, 256, y);
        g.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function makeSnowBumpTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = '#808080';
      g.fillRect(0, 0, 128, 128);
      for (let x = 0; x < 128; x += 4) {
        g.fillStyle = x % 8 === 0 ? '#a4a4a4' : '#686868';
        g.fillRect(x, 0, 2, 128);
      }
      for (let i = 0; i < 1600; i++) {
        const v = 100 + Math.floor(Math.random() * 80);
        g.fillStyle = `rgb(${v},${v},${v})`;
        g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makePuffTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const g = c.getContext('2d');
      const rad = g.createRadialGradient(32, 32, 3, 32, 32, 31);
      rad.addColorStop(0, 'rgba(255,255,255,0.96)');
      rad.addColorStop(0.42, 'rgba(244,250,255,0.68)');
      rad.addColorStop(0.78, 'rgba(222,238,255,0.18)');
      rad.addColorStop(1, 'rgba(222,238,255,0)');
      g.fillStyle = rad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    function makeGlintTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const g = c.getContext('2d');
      const rad = g.createRadialGradient(32, 32, 0, 32, 32, 26);
      rad.addColorStop(0, 'rgba(255,255,255,1)');
      rad.addColorStop(0.25, 'rgba(255,252,240,0.65)');
      rad.addColorStop(1, 'rgba(255,252,240,0)');
      g.fillStyle = rad;
      g.fillRect(0, 0, 64, 64);
      // Crisp 4-point sunlight crystal glint
      g.fillStyle = 'rgba(255,255,255,0.92)';
      g.beginPath();
      g.moveTo(32, 2); g.lineTo(35, 29); g.lineTo(62, 32); g.lineTo(35, 35);
      g.lineTo(32, 62); g.lineTo(29, 35); g.lineTo(2, 32); g.lineTo(29, 29);
      g.closePath();
      g.fill();
      return new THREE.CanvasTexture(c);
    }

    function makeRampStripeTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#f2f7fd';
      g.fillRect(0, 0, 256, 256);
      // Crisp ski-park cobalt guide edges
      g.fillStyle = '#2072c6';
      g.fillRect(0, 0, 22, 256);
      g.fillRect(234, 0, 22, 256);
      // High-visibility vivid alpine orange take-off band + subtle crisp chevrons
      g.fillStyle = '#e95628';
      g.fillRect(0, 0, 256, 36);
      g.fillStyle = 'rgba(233, 86, 40, 0.22)';
      for (let y = 76; y < 220; y += 52) {
        g.beginPath();
        g.moveTo(46, y + 26);
        g.lineTo(128, y);
        g.lineTo(210, y + 26);
        g.lineTo(210, y + 40);
        g.lineTo(128, y + 14);
        g.lineTo(46, y + 40);
        g.closePath();
        g.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function makeArchBannerTexture(text) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 96;
      const g = c.getContext('2d');
      g.fillStyle = '#d93d24';
      g.fillRect(0, 0, 512, 96);
      // Bold crisp alpine racing stripes on flanks
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, 512, 7);
      g.fillRect(0, 89, 512, 7);
      g.fillStyle = '#183764';
      g.fillRect(18, 16, 26, 64);
      g.fillRect(468, 16, 26, 64);
      g.fillStyle = '#ffffff';
      g.font = '800 34px Inter, -apple-system, Helvetica Neue, Arial, sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(text.toUpperCase(), 256, 50);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    const snowTex = makeSnowTexture();
    const snowBump = makeSnowBumpTexture();
    const puffTex = makePuffTexture();
    const glintTex = makeGlintTexture();
    const rampTex = makeRampStripeTexture();

    /* ================================================================
       CUSTOM ATMOSPHERIC ALPINE SKY DOME (Sun, Glow, Clouds, Stars)
       ================================================================ */
    const skyUniforms = {
      uTopColor: { value: ZONES[0].skyTop.clone() },
      uMidColor: { value: ZONES[0].skyMid.clone() },
      uHorizonColor: { value: ZONES[0].skyHorizon.clone() },
      uSunDir: { value: ZONES[0].sunDir.clone() },
      uSunColor: { value: ZONES[0].sunColor.clone() },
      uCloudColor: { value: ZONES[0].cloudColor.clone() },
      uTime: { value: 0 },
      uStars: { value: 0 }
    };

    const skyMat = new THREE.ShaderMaterial({
      uniforms: skyUniforms,
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      vertexShader: `
        varying vec3 vDir;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vDir = normalize(position);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3 uTopColor;
        uniform vec3 uMidColor;
        uniform vec3 uHorizonColor;
        uniform vec3 uSunDir;
        uniform vec3 uSunColor;
        uniform vec3 uCloudColor;
        uniform float uTime;
        uniform float uStars;
        varying vec3 vDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 4; i++) {
            v += a * noise(p);
            p *= 2.07;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 d = normalize(vDir);
          float h = clamp(d.y * 1.18 + 0.08, 0.0, 1.0);
          vec3 col = mix(uHorizonColor, uMidColor, smoothstep(0.0, 0.34, h));
          col = mix(col, uTopColor, smoothstep(0.28, 0.88, h));

          // Soft atmospheric scatter + brilliant crisp winter sun disc
          float sunDot = max(dot(d, normalize(uSunDir)), 0.0);
          col += uSunColor * pow(sunDot, 5.0) * 0.24;
          col += uSunColor * pow(sunDot, 42.0) * 0.42;
          float disc = smoothstep(0.9965, 0.9988, sunDot);
          col += uSunColor * disc * 1.35;

          // Delicate backlit wispy alpine cirrus clouds overhead
          if (d.y > 0.03) {
            vec2 uv = d.xz / (d.y + 0.28);
            uv.x += uTime * 0.008;
            uv.y -= uTime * 0.004;
            float n = fbm(uv * 1.35 + vec2(fbm(uv * 0.7) * 0.6));
            float cloud = smoothstep(0.55, 0.80, n) * smoothstep(0.03, 0.22, d.y) * smoothstep(0.92, 0.42, d.y);
            float rim = pow(sunDot, 4.0) * 0.3;
            col = mix(col, uCloudColor + uSunColor * rim, cloud * 0.52);
          }

          // Subtle twinkling alpine high-altitude stars during twilight zone
          if (uStars > 0.01 && d.y > 0.14) {
            vec2 sp = floor((d.xz / (d.y + 0.35)) * 125.0);
            float st = hash(sp);
            if (st > 0.994) {
              float tw = 0.6 + 0.4 * sin(uTime * 2.8 + st * 90.0);
              float fade = smoothstep(0.14, 0.44, d.y) * uStars * tw;
              col += vec3(0.95, 0.97, 1.0) * fade * 0.9;
            }
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(780, 32, 24), skyMat);
    scene.add(skyDome);

    /* ================================================================
       MONUMENTAL DISTANT ALPINE MOUNTAIN RANGE (Dual Parallax Layers)
       ================================================================ */
    const mountainRange = new THREE.Group();
    const peakMatNear = new THREE.MeshLambertMaterial({ vertexColors: true, fog: false, flatShading: true, side: THREE.DoubleSide });
    const peakMatFar = new THREE.MeshLambertMaterial({ vertexColors: true, fog: false, flatShading: true, side: THREE.DoubleSide });
    const peakLayers = [];

    function buildMountainRing(radius, count, minH, maxH, seed, mat, baseDip) {
      const rng = createRng(seed);
      const positions = [];
      const colors = [];
      const roles = []; // 0=lit snow, 1=shadow cliff, 2=misty base

      function pushTri(a, b, c, role) {
        positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
        colors.push(1, 1, 1, 1, 1, 1, 1, 1, 1);
        roles.push(role, role, role);
      }

      // Dramatic sculpted Matterhorn / Dolomite faceted mountain wall encircling downhill vista
      const startAng = -Math.PI * 0.95;
      const endAng = Math.PI * 0.08;
      for (let i = 0; i < count; i++) {
        const frac = i / (count - 1);
        const ang = lerp(startAng, endAng, frac) + (rng() - 0.5) * 0.06;
        // Slightly lower dramatic notch right ahead so golden valley opens luxuriously
        const centerDist = Math.abs(ang + Math.PI * 0.5);
        const valleyDip = smoothstep(0.0, 0.38, centerDist) * 0.35 + 0.65;
        const r = radius + (rng() - 0.5) * 55;
        const h = lerp(minH, maxH, Math.pow(rng(), 0.72)) * valleyDip;
        const w = (28 + rng() * 36) * (radius / 440);
        const cx = Math.cos(ang) * r;
        const cz = Math.sin(ang) * r;
        const tx = -Math.sin(ang);
        const tz = Math.cos(ang);
        const rx = Math.cos(ang);
        const rz = Math.sin(ang);

        const peak = new THREE.Vector3(cx, baseDip + h, cz);
        const shoulderL = new THREE.Vector3(
          cx - tx * w * 0.62 - rx * 10,
          baseDip + h * (0.48 + rng() * 0.2),
          cz - tz * w * 0.62 - rz * 10
        );
        const shoulderR = new THREE.Vector3(
          cx + tx * w * 0.62 - rx * 8,
          baseDip + h * (0.44 + rng() * 0.22),
          cz + tz * w * 0.62 - rz * 8
        );
        const baseL = new THREE.Vector3(cx - tx * w * 1.32, baseDip - 210, cz - tz * w * 1.32);
        const baseR = new THREE.Vector3(cx + tx * w * 1.32, baseDip - 210, cz + tz * w * 1.32);
        const ridgeF = new THREE.Vector3(
          cx - rx * (w * 0.58) + tx * ((rng() - 0.5) * w * 0.35),
          baseDip - 165,
          cz - rz * (w * 0.58) + tz * ((rng() - 0.5) * w * 0.35)
        );
        const midSnow = peak.clone().lerp(ridgeF, 0.42);
        midSnow.y += h * 0.08;

        // Crisp split down mountain crest: sunlit snow left face, dramatic sapphire-indigo shadow right face
        pushTri(peak, shoulderL, midSnow, 0);
        pushTri(peak, midSnow, shoulderR, 1);
        pushTri(shoulderL, baseL, ridgeF, 2);
        pushTri(shoulderL, ridgeF, midSnow, 0.15);
        pushTri(midSnow, ridgeF, baseR, 1);
        pushTri(midSnow, baseR, shoulderR, 1.15);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.computeVertexNormals();
      const mesh = new THREE.Mesh(geom, mat);
      mesh.frustumCulled = false;
      mountainRange.add(mesh);
      peakLayers.push({ mesh, roles, isFar: radius > 520 });
    }

    buildMountainRing(590, 26, 95, 225, 107, peakMatFar, -110);
    buildMountainRing(445, 22, 65, 158, 293, peakMatNear, -125);
    scene.add(mountainRange);

    const _cTmp1 = new THREE.Color();
    const _cTmp2 = new THREE.Color();
    function updateMountainColors(lit, shadow, base, horizon) {
      for (let l = 0; l < peakLayers.length; l++) {
        const layer = peakLayers[l];
        const colAttr = layer.mesh.geometry.attributes.color;
        const posAttr = layer.mesh.geometry.attributes.position;
        const roles = layer.roles;
        const haze = layer.isFar ? 0.34 : 0.14;
        for (let i = 0; i < roles.length; i++) {
          const r = roles[i];
          if (r < 0.1) _cTmp1.copy(lit);
          else if (r < 0.5) _cTmp1.copy(lit).lerp(shadow, 0.25);
          else if (r < 1.05) _cTmp1.copy(shadow);
          else if (r < 1.5) _cTmp1.copy(shadow).lerp(base, 0.45);
          else _cTmp1.copy(base);
          // Atmospheric valley haze gently softening mountain bases into crisp horizon mist
          const y = posAttr.getY(i);
          const lowMist = smoothstep(5, -120, y) * 0.72;
          _cTmp1.lerp(horizon, clamp(haze + lowMist, 0, 0.88));
          colAttr.setXYZ(i, _cTmp1.r, _cTmp1.g, _cTmp1.b);
        }
        colAttr.needsUpdate = true;
      }
    }

    /* ================================================================
       CONTINUOUS ROLLING SLIDING TERRAIN MESH
       ================================================================ */
    const TERRAIN_COLS = 54;   // X samples across mountain valley
    const TERRAIN_ROWS = 84;   // Z samples forward + slightly behind
    const TERRAIN_STEP_Z = 3.2;
    const TERRAIN_HALF_W = 108;
    const TERRAIN_BEHIND = 28; // meters behind anchor

    const terrainGeom = new THREE.BufferGeometry();
    const tVertCount = (TERRAIN_COLS + 1) * (TERRAIN_ROWS + 1);
    const tPos = new Float32Array(tVertCount * 3);
    const tCol = new Float32Array(tVertCount * 3);
    const tUv = new Float32Array(tVertCount * 2);
    const tIdx = [];

    for (let r = 0; r < TERRAIN_ROWS; r++) {
      for (let c = 0; c < TERRAIN_COLS; c++) {
        const a = r * (TERRAIN_COLS + 1) + c;
        const b = a + 1;
        const d = a + (TERRAIN_COLS + 1);
        const e = d + 1;
        tIdx.push(a, b, d, b, e, d);
      }
    }
    terrainGeom.setIndex(tIdx);
    terrainGeom.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
    terrainGeom.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
    terrainGeom.setAttribute('uv', new THREE.BufferAttribute(tUv, 2));

    const terrainSparkleUniforms = {
      uSunCol: { value: new THREE.Color('#fff8ec') },
      uSunVec: { value: ZONES[0].sunDir.clone() }
    };

    const terrainMat = new THREE.MeshStandardMaterial({
      map: snowTex,
      bumpMap: snowBump,
      bumpScale: 0.09,
      vertexColors: true,
      roughness: 0.68,
      metalness: 0.02
    });
    terrainMat.onBeforeCompile = (shader) => {
      shader.uniforms.uSunCol = terrainSparkleUniforms.uSunCol;
      shader.uniforms.uSunVec = terrainSparkleUniforms.uSunVec;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vSnowWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSnowWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace(
          '#include <common>',
          `#include <common>
           varying vec3 vSnowWorldPos;
           uniform vec3 uSunCol;
           uniform vec3 uSunVec;
           float snowHash(vec2 p) {
             return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
           }`
        )
        .replace(
          '#include <dithering_fragment>',
          `float camDist = length(cameraPosition - vSnowWorldPos);
           if (camDist < 78.0) {
             vec2 cell = floor(vSnowWorldPos.xz * 2.6);
             float rnd = snowHash(cell);
             if (rnd > 0.88) {
               vec3 viewD = normalize(cameraPosition - vSnowWorldPos);
               vec3 jitterN = normalize(vec3(
                 snowHash(cell + 13.7) - 0.5,
                 1.45,
                 snowHash(cell + 41.3) - 0.5
               ));
               vec3 halfV = normalize(viewD + normalize(uSunVec));
               float spec = pow(max(dot(jitterN, halfV), 0.0), 42.0);
               float nearFade = (1.0 - smoothstep(28.0, 76.0, camDist));
               gl_FragColor.rgb += uSunCol * spec * nearFade * 0.55;
             }
           }
           #include <dithering_fragment>`
        );
    };

    const terrainMesh = new THREE.Mesh(terrainGeom, terrainMat);
    terrainMesh.receiveShadow = true;
    terrainMesh.frustumCulled = false;
    scene.add(terrainMesh);

    const _snowMain = new THREE.Color('#f7fbff');
    const _snowEdge = new THREE.Color('#ddebf9');
    const _snowPowder = new THREE.Color('#e8f2fc');
    const _cliffRock = new THREE.Color('#7087a4');
    const _pisteTrim = new THREE.Color('#c8dff4');
    let lastTerrainAnchor = Infinity;

    // Non-linear lateral distribution: dense crisp resolution on main groomed piste, stretching out to grand walls
    const colOffsets = new Float32Array(TERRAIN_COLS + 1);
    for (let c = 0; c <= TERRAIN_COLS; c++) {
      const u = (c / TERRAIN_COLS) * 2 - 1; // -1..1
      const sgn = u < 0 ? -1 : 1;
      const au = Math.abs(u);
      colOffsets[c] = sgn * (au * 0.42 + au * au * au * 0.58) * TERRAIN_HALF_W;
    }

    function updateTerrainMesh(anchorZ, snowLitCol, snowSideCol) {
      let vi = 0;
      let ui = 0;
      for (let r = 0; r <= TERRAIN_ROWS; r++) {
        const z = anchorZ + TERRAIN_BEHIND - r * TERRAIN_STEP_Z;
        const cx = getCenterX(z);
        for (let c = 0; c <= TERRAIN_COLS; c++) {
          const dx = colOffsets[c];
          const x = cx + dx;
          const y = getTerrainHeight(x, z);
          tPos[vi] = x;
          tPos[vi + 1] = y;
          tPos[vi + 2] = z;

          // World-locked UVs so snow corduroy never swims under the skier!
          tUv[ui] = dx * 0.085;
          tUv[ui + 1] = z * 0.085;

          // Crisp sunlit alpine color shading distinguishing track, soft groomed verge, deep flank powder & slate outcrops
          const adx = Math.abs(dx);
          if (adx < PISTE_HALF - 1.5) {
            _cTmp2.copy(snowLitCol);
          } else if (adx < PISTE_HALF + 1.5) {
            // Subtle cool groomed piste-border rim gives clear razor-sharp sightline down the run
            const band = 1 - Math.abs(adx - PISTE_HALF) / 1.5;
            _cTmp2.copy(snowLitCol).lerp(_pisteTrim, band * 0.34);
          } else if (adx < 46) {
            const blend = smoothstep(PISTE_HALF + 1.5, 42, adx);
            _cTmp2.copy(snowSideCol).lerp(_snowEdge, blend * 0.55);
          } else {
            // Exposed frosty granite patches breaking through high steep outer ridges
            const ridge = Math.sin(z * 0.055 + x * 0.07) * 0.5 + 0.5;
            const rockMix = smoothstep(46, 86, adx) * smoothstep(0.32, 0.78, ridge) * 0.72;
            _cTmp2.copy(_snowEdge).lerp(_cliffRock, rockMix);
          }
          tCol[vi] = _cTmp2.r;
          tCol[vi + 1] = _cTmp2.g;
          tCol[vi + 2] = _cTmp2.b;
          vi += 3;
          ui += 2;
        }
      }
      terrainGeom.attributes.position.needsUpdate = true;
      terrainGeom.attributes.uv.needsUpdate = true;
      terrainGeom.attributes.color.needsUpdate = true;
      terrainGeom.computeVertexNormals();
    }

    /* ================================================================
       SHARED LOW-POLY CRAFTED PROPS & FACTORIES
       ================================================================ */
    const sharedMat = {
      trunk: new THREE.MeshStandardMaterial({ color: 0x563d2d, roughness: 0.92 }),
      pineDark: new THREE.MeshStandardMaterial({ color: 0x1e4f3d, roughness: 0.86, flatShading: true }),
      pineMid: new THREE.MeshStandardMaterial({ color: 0x28614a, roughness: 0.84, flatShading: true }),
      pineSnow: new THREE.MeshStandardMaterial({ color: 0xf4f9ff, roughness: 0.72, flatShading: true }),
      rock: new THREE.MeshStandardMaterial({ color: 0x627082, roughness: 0.88, flatShading: true }),
      rockDark: new THREE.MeshStandardMaterial({ color: 0x4b5869, roughness: 0.9, flatShading: true }),
      redGate: new THREE.MeshStandardMaterial({ color: 0xe23c26, roughness: 0.42 }),
      blueGate: new THREE.MeshStandardMaterial({ color: 0x1e6ed4, roughness: 0.42 }),
      redFlag: new THREE.MeshStandardMaterial({ color: 0xf04830, roughness: 0.55, side: THREE.DoubleSide }),
      blueFlag: new THREE.MeshStandardMaterial({ color: 0x2682ee, roughness: 0.55, side: THREE.DoubleSide }),
      flagCleared: new THREE.MeshStandardMaterial({ color: 0xf7be38, roughness: 0.42, emissive: 0x7a4f00, emissiveIntensity: 0.25, side: THREE.DoubleSide }),
      goldRing: new THREE.MeshStandardMaterial({ color: 0xffcf48, roughness: 0.24, metalness: 0.48, emissive: 0xd98a12, emissiveIntensity: 0.32 }),
      rampTop: new THREE.MeshStandardMaterial({ map: rampTex, roughness: 0.65 }),
      rampSide: new THREE.MeshStandardMaterial({ color: 0xdbe9f8, roughness: 0.78 }),
      timber: new THREE.MeshStandardMaterial({ color: 0x7c5538, roughness: 0.86 }),
      steel: new THREE.MeshStandardMaterial({ color: 0x526273, roughness: 0.45, metalness: 0.52 }),
      gondolaRed: new THREE.MeshStandardMaterial({ color: 0xd63b28, roughness: 0.35 }),
      fenceOrange: new THREE.MeshStandardMaterial({ color: 0xeb5a2c, roughness: 0.58 }),
      beacon: new THREE.MeshBasicMaterial({ color: 0xffe4a0 })
    };

    // Sculpted snowy alpine spruce factory (3 crisp size silhouettes with real frosted snow pillows!)
    const pineProto = [];
    function buildPineTemplate(seed) {
      const rng = createRng(seed);
      const grp = new THREE.Group();
      const trunkH = 2.0;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.38, trunkH, 7), sharedMat.trunk);
      trunk.position.y = trunkH * 0.5 - 0.3;
      trunk.castShadow = true;
      grp.add(trunk);

      const tiers = [
        { y: 2.2, r: 2.15, h: 2.75 },
        { y: 3.9, r: 1.72, h: 2.45 },
        { y: 5.4, r: 1.24, h: 2.15 },
        { y: 6.75, r: 0.72, h: 1.65 }
      ];
      tiers.forEach((t, idx) => {
        const g = new THREE.ConeGeometry(t.r, t.h, 8, 1);
        // Subtle organic jitter on skirt rim for genuine painted spruce needles
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          if (p.getY(i) < 0) {
            const ang = Math.atan2(p.getZ(i), p.getX(i));
            const s = 0.9 + 0.16 * Math.sin(ang * 3 + seed + idx);
            p.setX(i, p.getX(i) * s);
            p.setZ(i, p.getZ(i) * s);
            p.setY(i, p.getY(i) + (rng() - 0.5) * 0.22);
          }
        }
        g.computeVertexNormals();
        const cone = new THREE.Mesh(g, idx % 2 === 0 ? sharedMat.pineDark : sharedMat.pineMid);
        cone.position.y = t.y;
        cone.rotation.y = idx * 0.48 + rng() * 0.5;
        cone.castShadow = true;
        cone.receiveShadow = true;
        grp.add(cone);

        // Plump crisp sunlit white snow cap draped onto the top half of every spruce tier!
        const sg = new THREE.ConeGeometry(t.r * 0.72, t.h * 0.56, 8, 1);
        const sp = sg.attributes.position;
        for (let i = 0; i < sp.count; i++) {
          if (sp.getY(i) < 0) {
            const s = 0.92 + 0.14 * Math.sin(i * 2.1 + idx);
            sp.setX(i, sp.getX(i) * s);
            sp.setZ(i, sp.getZ(i) * s);
          }
        }
        sg.computeVertexNormals();
        const snowCap = new THREE.Mesh(sg, sharedMat.pineSnow);
        snowCap.position.y = t.y + t.h * 0.26;
        snowCap.rotation.y = cone.rotation.y + 0.15;
        snowCap.receiveShadow = true;
        grp.add(snowCap);
      });
      return grp;
    }
    pineProto.push(buildPineTemplate(11), buildPineTemplate(37), buildPineTemplate(73));

    // Faceted snow-capped alpine granite boulder (unmistakable silhouette on crisp white snow)
    function createBoulder(scale, seed) {
      const rng = createRng(seed);
      const grp = new THREE.Group();
      const geom = new THREE.DodecahedronGeometry(1.55, 1);
      const p = geom.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
        const n = 0.8 + 0.32 * Math.sin(vx * 2.1 + seed) * Math.cos(vz * 1.9 + vy);
        p.setXYZ(i, vx * n * 1.12, vy * n * 0.76, vz * n * 1.04);
      }
      geom.computeVertexNormals();
      const body = new THREE.Mesh(geom, rng() > 0.4 ? sharedMat.rock : sharedMat.rockDark);
      body.position.y = 0.62;
      body.castShadow = true;
      body.receiveShadow = true;
      grp.add(body);

      // Soft pillowy sunlit white snow pillow draped on boulder top
      const capG = new THREE.SphereGeometry(1.08, 8, 6, 0, Math.PI * 2, 0, Math.PI * 0.48);
      const cap = new THREE.Mesh(capG, sharedMat.pineSnow);
      cap.scale.set(1.12, 0.48, 0.96);
      cap.position.set(-0.08, 1.05, -0.05);
      cap.receiveShadow = true;
      grp.add(cap);

      grp.scale.setScalar(scale);
      grp.rotation.y = rng() * Math.PI * 2;
      return grp;

    // Slalom gate pair (authentic twin crisp poles + live wind-fluttering triangular flag!)
    const poleGeo = new THREE.CylinderGeometry(0.085, 0.10, 3.4, 8);
    const baseRingGeo = new THREE.CylinderGeometry(0.28, 0.34, 0.14, 10);

    function createSlalomGate(isRed, x, z, halfGap) {
      const grp = new THREE.Group();
      const poleMat = isRed ? sharedMat.redGate : sharedMat.blueGate;
      const flagMat = isRed ? sharedMat.redFlag : sharedMat.blueFlag;
      const poles = [];
      const flags = [];
      const beacons = [];

      [-1, 1].forEach((side) => {
        const px = x + side * halfGap;
        const py = getTerrainHeight(px, z);
        const holder = new THREE.Group();
        holder.position.set(px, py - 0.12, z);

        // Colored slalom gate shaft with subtle crisp snow base & white center stripe
        const shaft = new THREE.Mesh(poleGeo, poleMat);
        shaft.position.y = 1.7;
        shaft.castShadow = true;
        holder.add(shaft);

        const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.42, 8), poleWhiteMat);
        stripe.position.y = 1.65;
        holder.add(stripe);

        const collar = new THREE.Mesh(baseRingGeo, poleMat);
        collar.position.y = 0.14;
        holder.add(collar);

        // Glowing warm top beacon visible dynamically during twilight runs
        const b = new THREE.Mesh(beaconGeo, sharedMat.beacon);
        b.position.y = 3.46;
        b.visible = false;
        holder.add(b);
        beacons.push(b);

        // Crisp rectangular world-cup gate flag pointing cleanly outward
        const fg = flagGeo.clone();
        const flag = new THREE.Mesh(fg, flagMat);
        flag.position.set(0, 2.75, 0);

        flag.castShadow = true;
        holder.add(flag);
        flags.push({ mesh: flag, side, phase: Math.random() * 6.28 });

        grp.add(holder);
        poles.push({ holder, px, bend: 0, bendVel: 0 });
      });

      // Authentic World-Cup blue/red dyed snow track strip hugging the curved slope flush
      const segs = 8;
      const dPos = [];
      const dIdx = [];
      const halfStrip = 0.24;
      for (let i = 0; i <= segs; i++) {
        const lx = lerp(x - halfGap + 0.15, x + halfGap - 0.15, i / segs);
        const y0 = getTerrainHeight(lx, z + halfStrip) + 0.09;
        const y1 = getTerrainHeight(lx, z - halfStrip) + 0.09;
        dPos.push(lx, y0, z + halfStrip, lx, y1, z - halfStrip);
        if (i < segs) {
          const a = i * 2;
          dIdx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
        }
      }
      const dyeGeom = new THREE.BufferGeometry();
      dyeGeom.setAttribute('position', new THREE.Float32BufferAttribute(dPos, 3));
      dyeGeom.setIndex(dIdx);

        polygonOffsetFactor: -2,
        side: THREE.DoubleSide

      const dye = new THREE.Mesh(dyeGeom, dyeMat);
      grp.add(dye);

      return {
        group: grp,
        x, z, halfGap, isRed,
        poles, flags, beacons, dye,
        passed: false
      };
    }

    // Crisp groomed snow ski-park kicker ramp aligned seamlessly onto terrain height!
    function createRamp(x, z, width, length, liftH, withRing) {
      const grp = new THREE.Group();
      const segL = 10;
      const hw = width * 0.5;
      const topPos = [];
      const topUv = [];
      const topIdx = [];
      const sidePos = [];

      // Curved concave kicker profile rising cleanly off natural terrain and kicking upwards at z - length
      const profile = (t) => Math.pow(t, 1.55) * liftH;

      for (let i = 0; i <= segL; i++) {
        const t = i / segL;
        const rz = z - t * length;
        const hOff = profile(t) - (i === 0 ? 0.14 : 0);
        const yL = getTerrainHeight(x - hw, rz) + hOff;
        const yR = getTerrainHeight(x + hw, rz) + hOff;
        topPos.push(x - hw, yL, rz, x + hw, yR, rz);
        topUv.push(0, t, 1, t);
        if (i < segL) {
          const a = i * 2;
          topIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
      }
      const topGeom = new THREE.BufferGeometry();
      topGeom.setAttribute('position', new THREE.Float32BufferAttribute(topPos, 3));
      topGeom.setAttribute('uv', new THREE.Float32BufferAttribute(topUv, 2));
      topGeom.setIndex(topIdx);
      topGeom.computeVertexNormals();
      const topMesh = new THREE.Mesh(topGeom, sharedMat.rampTop);
      topMesh.receiveShadow = true;
      topMesh.castShadow = true;
      grp.add(topMesh);

      // Solid snowy angled side wedges + crisp vertical kicker back wall (no floating edges!)
      const pushQuad = (a, b, c, d) => {
        sidePos.push(
          a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2],
          a[0], a[1], a[2], c[0], c[1], c[2], d[0], d[1], d[2]
        );
      };
      for (let i = 0; i < segL; i++) {
        const t0 = i / segL, t1 = (i + 1) / segL;
        const z0 = z - t0 * length, z1 = z - t1 * length;
        const p0 = profile(t0), p1 = profile(t1);
        // Left wall (flared out gently for lush built snow look)
        const gl0 = getTerrainHeight(x - hw, z0), gl1 = getTerrainHeight(x - hw, z1);
        const sl0 = getTerrainHeight(x - hw - 1.1, z0) - 0.5, sl1 = getTerrainHeight(x - hw - 1.1, z1) - 0.5;
        pushQuad([x - hw - 1.1, sl0, z0], [x - hw, gl0 + p0, z0], [x - hw, gl1 + p1, z1], [x - hw - 1.1, sl1, z1]);
        // Right wall
        const gr0 = getTerrainHeight(x + hw, z0), gr1 = getTerrainHeight(x + hw, z1);
        const sr0 = getTerrainHeight(x + hw + 1.1, z0) - 0.5, sr1 = getTerrainHeight(x + hw + 1.1, z1) - 0.5;
        pushQuad([x + hw, gl0 + p0, z0], [x + hw + 1.1, sr0, z0], [x + hw + 1.1, sr1, z1], [x + hw, gr1 + p1, z1]);
      }
      // Lip back face
      const ze = z - length;
      const gL = getTerrainHeight(x - hw, ze), gR = getTerrainHeight(x + hw, ze);
      pushQuad([x - hw, gL + liftH, ze], [x + hw, gR + liftH, ze], [x + hw + 1.1, gR - 0.6, ze], [x - hw - 1.1, gL - 0.6, ze]);

      const sideGeom = new THREE.BufferGeometry();
      sideGeom.setAttribute('position', new THREE.Float32BufferAttribute(sidePos, 3));
      sideGeom.computeVertexNormals();
      const sideMesh = new THREE.Mesh(sideGeom, sharedMat.rampSide);
      sideMesh.receiveShadow = true;
      sideMesh.castShadow = true;
      grp.add(sideMesh);

      // Flanking ski-park take-off marker poles
      [-1, 1].forEach((s) => {
        const px = x + s * (hw + 0.35);
        const py = getTerrainHeight(px, ze);
        const marker = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.09, liftH + 1.4, 7), sharedMat.fenceOrange);
        marker.position.set(px, py + (liftH + 1.4) * 0.5 - 0.2, ze);
        marker.castShadow = true;
        grp.add(marker);
      });

      // Optional sparkling airborne gold alpine bonus ring hanging over the sweet jump arc!
      let ring = null;
      if (withRing) {
        const ringZ = ze - 12.5;
        const ringY = getTerrainHeight(x, ringZ) + liftH + 3.2;
        const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.22, 10, 28), sharedMat.goldRing);
        ringMesh.position.set(x, ringY, ringZ);
        grp.add(ringMesh);
        ring = { mesh: ringMesh, x, y: ringY, z: ringZ, collected: false };
      }

      return { group: grp, x, zStart: z, zEnd: ze, hw, length, liftH, ring, triggered: false };
    }

    // Authentic rhythmic passing resort chairlift tower + overhead cables + dangling red gondola chair
    function createLiftTower(z, prevZ) {
      const grp = new THREE.Group();
      const side = -1; // Left ridge overlooks the mountain authentically
      const x = getCenterX(z) + side * (PISTE_HALF + 7.5);
      const y = getTerrainHeight(x, z);
      const towerH = 14.5;

      // Steel pillar
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.44, towerH, 8), sharedMat.steel);
      mast.position.set(x, y + towerH * 0.5 - 1.0, z);
      mast.castShadow = true;
      grp.add(mast);

      // Wide classic cross-arm T-bar & pulley wheel silhouette
      const arm = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.34, 0.4), sharedMat.steel);
      arm.position.set(x, y + towerH - 1.2, z);
      grp.add(arm);

      [-2.35, 2.35].forEach((ox) => {
        const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.1, 6, 12), sharedMat.steel);
        wheel.rotation.y = Math.PI / 2;
        wheel.position.set(x + ox, y + towerH - 1.45, z);
        grp.add(wheel);
      });

      // Twin gracefully sagged lift cables connecting back to previous tower
      if (prevZ !== null) {
        const px = getCenterX(prevZ) + side * (PISTE_HALF + 7.5);
        const py = getTerrainHeight(px, prevZ) + towerH - 1.5;
        const cy = y + towerH - 1.5;
        const cableMat = new THREE.LineBasicMaterial({ color: 0x33475c, transparent: true, opacity: 0.72 });
        [-2.35, 2.35].forEach((ox) => {
          const pts = [];
          const steps = 8;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const sag = Math.sin(t * Math.PI) * 2.2;
            pts.push(new THREE.Vector3(lerp(px + ox, x + ox, t), lerp(py, cy, t) - sag, lerp(prevZ, z, t)));
          }
          grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), cableMat));
        });

        // Cheerful little crimson iconic chairlift gondola gently suspended mid-span
        const t = 0.46;
        const ox = 2.35;
        const gx = lerp(px + ox, x + ox, t);
        const gy = lerp(py, cy, t) - Math.sin(t * Math.PI) * 2.2;
        const gz = lerp(prevZ, z, t);

        const gondola = new THREE.Group();
        gondola.position.set(gx, gy, gz);
        const hanger = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.2, 5), sharedMat.steel);
        hanger.position.y = -1.1;
        gondola.add(hanger);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.45, 1.4), sharedMat.gondolaRed);
        cabin.position.y = -2.6;
        gondola.add(cabin);
        // Bright tiny alpine wrap-around glass window ribbon
        const win = new THREE.Mesh(
          new THREE.BoxGeometry(1.75, 0.62, 1.45),
          new THREE.MeshBasicMaterial({ color: 0xdaf0ff })
        );
        win.position.y = -2.35;
        gondola.add(win);
        grp.add(gondola);
        return { group: grp, gondola, phase: Math.random() * 6.28 };
      }

      return { group: grp, gondola: null, phase: 0 };
    }

    // Occasional classic bright orange alpine wooden safety fencing right on dramatic sweeping outside bends
    function createCornerFence(z, side) {
      const grp = new THREE.Group();
      const count = 4;
      const spacing = 3.2;
      for (let i = 0; i < count; i++) {
        const fz = z - i * spacing;
        const fx = getCenterX(fz) + side * (PISTE_HALF + 1.6);
        const fy = getTerrainHeight(fx, fz);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.65, 6), sharedMat.timber);
        post.position.set(fx, fy + 0.72, fz);
        post.castShadow = true;
        grp.add(post);

        if (i < count - 1) {
          const nz = fz - spacing;
          const nx = getCenterX(nz) + side * (PISTE_HALF + 1.6);
          const ny = getTerrainHeight(nx, nz);
          const mx = (fx + nx) * 0.5, my = (fy + ny) * 0.5 + 0.88, mz = (fz + nz) * 0.5;
          const dx = nx - fx, dy = ny - fy, dz = nz - fz;
          const len = Math.hypot(dx, dy, dz);
          const net = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.85, len), sharedMat.fenceOrange);
          net.position.set(mx, my, mz);
          net.lookAt(nx, ny + 0.88, nz);
          grp.add(net);
        }
      }
      return grp;
    }

      // Twin sleek articulated racing skis (individually wedgeable for braking + leaning on steel edges!)
      function makeSki() {
