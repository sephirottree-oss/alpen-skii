        const tip = new THREE.Mesh(new THREE.BoxGeometry(0.155, 0.042, 0.36), skiTipMat);
        tip.position.set(0, 0.10, -1.14);
        tip.rotation.x = 0.38;
        g.add(tip);
        // Race binding highlight
        const bind = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.07, 0.44), bootMat);
        bind.position.set(0, 0.08, 0.04);
        g.add(bind);
        return g;
      }

      const leftSki = makeSki();
      leftSki.position.set(-0.22, 0, 0);
      const rightSki = makeSki();
      rightSki.position.set(0.22, 0, 0);
      rig.add(leftSki, rightSki);

      // Articulated legs linking skis cleanly to responsive dipping hips
      function makeLeg(x) {
        const g = new THREE.Group();
        g.position.set(x, 0.12, 0);
        const boot = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.24, 0.34), bootMat);
        boot.position.set(0, 0.12, -0.02);
        boot.castShadow = true;
        g.add(boot);

        const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.105, 0.48, 8), pantMat);
        shin.position.set(0, 0.40, -0.05);
        shin.rotation.x = 0.22;
        shin.castShadow = true;
        g.add(shin);

        const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.115, 0.48, 8), pantMat);
        thigh.position.set(0, 0.74, 0.04);
        thigh.rotation.x = -0.34;
        thigh.castShadow = true;
        g.add(thigh);
        return g;
      }
      const leftLeg = makeLeg(-0.21);
      const rightLeg = makeLeg(0.21);
      rig.add(leftLeg, rightLeg);

      // Upper body hinged smoothly at athletic hip point
      const torsoPivot = new THREE.Group();
      torsoPivot.position.set(0, 0.92, 0.08);
      rig.add(torsoPivot);

      // Sculpted winter parka torso
      const jacket = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.24, 0.68, 10), jacketMat);
      jacket.scale.set(1.18, 1, 0.84);
      jacket.position.set(0, 0.34, 0);
      jacket.castShadow = true;
      torsoPivot.add(jacket);

      // Crisp clean classic retro Swiss white chest band wrapping all sides
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.278, 0.268, 0.13, 10), stripeMat);
      band.scale.set(1.18, 1, 0.85);
      band.position.set(0, 0.42, 0);
      torsoPivot.add(band);

      // Sleek minimal dark navy alpine back ridge / racing bib silhouette from chase-cam angle
      const pack = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.40, 0.14), pantMat);
      pack.position.set(0, 0.36, 0.22);
      pack.castShadow = true;
      torsoPivot.add(pack);
      const packStripe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.055, 0.15), stripeMat);
      packStripe.position.set(0, 0.45, 0.22);
      torsoPivot.add(packStripe);

      // Rounded helmet + golden mirrored panoramic goggles
      const head = new THREE.Group();
      head.position.set(0, 0.82, -0.02);
      const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.225, 12, 10), helmetMat);
      helmet.scale.set(0.96, 1.0, 1.04);
      helmet.castShadow = true;
      head.add(helmet);
      // Goggle strap gleaming horizontally across helmet back + golden ski lenses up front
      const strap = new THREE.Mesh(new THREE.CylinderGeometry(0.226, 0.226, 0.075, 12), jacketMat);
      strap.position.set(0, -0.01, 0.01);
      head.add(strap);
      const lens = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.13, 0.12), goggleMat);
      lens.position.set(0, 0.0, -0.18);
      head.add(lens);
      torsoPivot.add(head);

      // Flowing wind-animated bright cream winter scarf streaming poetically behind racer
      const scarfSegs = [];
      let parentNode = torsoPivot;
      for (let i = 0; i < 4; i++) {
        const seg = new THREE.Group();
        seg.position.set(i === 0 ? 0.06 : 0, i === 0 ? 0.64 : 0, i === 0 ? 0.19 : 0.22);
        const strip = new THREE.Mesh(new THREE.BoxGeometry(0.14 - i * 0.016, 0.045, 0.25), scarfMat);
        strip.position.z = 0.11;
        seg.add(strip);
        parentNode.add(seg);
        scarfSegs.push(seg);
        parentNode = seg;
      }

      // Dynamic articulated arms holding crisp aluminum racing poles
      function makeArm(side) {
        const shoulder = new THREE.Group();
        shoulder.position.set(side * 0.34, 0.56, 0);
        const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.078, 0.42, 7), jacketMat);
        upper.position.set(side * 0.08, -0.17, -0.08);
        upper.rotation.z = side * 0.35;
        upper.rotation.x = 0.48;
        upper.castShadow = true;
        shoulder.add(upper);

        const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.34, 7), jacketMat);
        fore.position.set(side * 0.14, -0.32, -0.30);
        fore.rotation.x = 1.12;
        shoulder.add(fore);

        const glove = new THREE.Mesh(new THREE.SphereGeometry(0.078, 7, 7), gloveMat);
        glove.position.set(side * 0.14, -0.35, -0.46);
        shoulder.add(glove);

        // Sleek aerodynamic trailing alpine ski pole angled backwards beneath arm
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.014, 1.25, 5), poleMat);
        pole.position.set(side * 0.18, -0.45, 0.12);
        pole.rotation.x = 1.28;
        pole.rotation.z = -side * 0.08;
        shoulder.add(pole);

        const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.018, 8), jacketMat);
        basket.position.set(side * 0.22, -0.57, 0.64);
        basket.rotation.x = 1.28;
        shoulder.add(basket);

        torsoPivot.add(shoulder);
        return shoulder;
      }
      const leftArm = makeArm(-1);
      const rightArm = makeArm(1);

      scene.add(root);
      return {
        root, trickPivot, rig, torsoPivot, head,
        leftSki, rightSki, leftLeg, rightLeg,
        leftArm, rightArm, scarfSegs
      };
    }

    const skier = buildSkier();

    // Soft alpine blue shadow oval anchored seamlessly onto terrain underneath skier (super clean mid-air landing cue!)
    const shadowTex = (function () {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      const r = g.createRadialGradient(32, 32, 4, 32, 32, 30);
      r.addColorStop(0, 'rgba(34, 68, 118, 0.42)');
      r.addColorStop(0.55, 'rgba(54, 92, 142, 0.16)');
      r.addColorStop(1, 'rgba(54, 92, 142, 0)');
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })();
    const skierShadow = new THREE.Mesh(
      new THREE.PlaneGeometry(2.1, 2.8),
      new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -3
      })
    );
    skierShadow.rotation.x = -Math.PI / 2;
    skierShadow.renderOrder = 2;
    scene.add(skierShadow);

    /* ================================================================
       PERSISTENT DUAL CARVED SKI TRACKS ON SNOW SURFACE
       ================================================================ */
    const TRAIL_MAX = 150;
    function createTrackRibbon() {
      const pos = new Float32Array(TRAIL_MAX * 2 * 3);
      const alpha = new Float32Array(TRAIL_MAX * 2);
      const idx = [];
      for (let i = 0; i < TRAIL_MAX - 1; i++) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        idx.push(a, b, c, b, d, c);
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geom.setAttribute('aFade', new THREE.BufferAttribute(alpha, 1));
      geom.setIndex(idx);
      const edgeU = new Float32Array(TRAIL_MAX * 2);
      for (let i = 0; i < TRAIL_MAX; i++) {
        edgeU[i * 2] = 0;
        edgeU[i * 2 + 1] = 1;
      }
      geom.setAttribute('aEdge', new THREE.BufferAttribute(edgeU, 1));
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
        side: THREE.DoubleSide,
        uniforms: {
          uColor: { value: new THREE.Color('#88b2dc') }
        },
        vertexShader: `
          attribute float aFade;
          attribute float aEdge;
          varying float vFade;
          varying float vEdge;
          void main() {
            vFade = aFade;
            vEdge = aEdge;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          varying float vFade;
          varying float vEdge;
          void main() {
            if (vFade < 0.01) discard;
            float profile = 1.0 - abs(vEdge * 2.0 - 1.0);
            float groove = smoothstep(0.0, 0.48, profile);
            gl_FragColor = vec4(uColor, vFade * groove * 0.52);
          }
        `
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.frustumCulled = false;
      mesh.renderOrder = 1;
      scene.add(mesh);
      return { mesh, geom, pos, alpha, mat, points: [] };
    }

    const trackL = createTrackRibbon();
    const trackR = createTrackRibbon();
    let lastTrailZ = Infinity;

    function pushTrackPoint(ribbon, x, y, z, width, breakFlag) {
      ribbon.points.push({ x, y, z, w: width, brk: breakFlag });
      if (ribbon.points.length > TRAIL_MAX) ribbon.points.shift();
    }

    function rebuildTrackRibbon(ribbon) {
      const pts = ribbon.points;
      const n = pts.length;
      const pos = ribbon.pos;
      const alp = ribbon.alpha;
      for (let i = 0; i < TRAIL_MAX; i++) {
        if (i < n) {
          const p = pts[i];
          const age = i / Math.max(1, n - 1);
          const fade = p.brk ? 0 : Math.pow(age, 1.35);
          // Slight carve ribbon perpendicular along X for crisp parallel ski grooves
          pos[i * 6 + 0] = p.x - p.w;
          pos[i * 6 + 1] = p.y;
          pos[i * 6 + 2] = p.z;
          pos[i * 6 + 3] = p.x + p.w;
          pos[i * 6 + 4] = p.y;
          pos[i * 6 + 5] = p.z;
          alp[i * 2] = fade;
          alp[i * 2 + 1] = fade;
        } else {
          const lp = n > 0 ? pts[n - 1] : { x: 0, y: -999, z: 0 };
          pos[i * 6 + 0] = lp.x; pos[i * 6 + 1] = lp.y; pos[i * 6 + 2] = lp.z;
          pos[i * 6 + 3] = lp.x; pos[i * 6 + 4] = lp.y; pos[i * 6 + 5] = lp.z;
          alp[i * 2] = 0; alp[i * 2 + 1] = 0;
        }
      }
      ribbon.geom.attributes.position.needsUpdate = true;
      ribbon.geom.attributes.aFade.needsUpdate = true;
    }

    function clearTracks() {
      trackL.points.length = 0;
      trackR.points.length = 0;
      rebuildTrackRibbon(trackL);
      rebuildTrackRibbon(trackR);
      lastTrailZ = Infinity;
    }

    /* ================================================================
       SUNLIT SNOW SPRAY, GOLD GATE SPARKLES & DIAMOND DUST SYSTEM
       ================================================================ */
    const MAX_PARTICLES = 420;
    const pPos = new Float32Array(MAX_PARTICLES * 3);
    const pCol = new Float32Array(MAX_PARTICLES * 3);
    const pSize = new Float32Array(MAX_PARTICLES);
    const pAlpha = new Float32Array(MAX_PARTICLES);
    const pData = new Array(MAX_PARTICLES);
    for (let i = 0; i < MAX_PARTICLES; i++) {
      pData[i] = { active: false, vx: 0, vy: 0, vz: 0, life: 0, maxLife: 1, s0: 1, s1: 2, grav: 8, fade: 1 };
      pAlpha[i] = 0;
    }
    let pCursor = 0;

    const partGeom = new THREE.BufferGeometry();
    partGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    partGeom.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
    partGeom.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
    partGeom.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));

    const partMat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: puffTex },
        uScale: { value: renderer.domElement.height * 0.55 }
      },
      transparent: true,
      depthWrite: false,
      vertexShader: `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aAlpha;
        uniform float uScale;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = aColor;
          vAlpha = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = clamp(aSize * (uScale / max(1.0, -mv.z)), 1.0, 128.0);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D uMap;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          if (vAlpha < 0.01) discard;
          vec4 tex = texture2D(uMap, gl_PointCoord);
          float a = tex.a * vAlpha;
          if (a < 0.01) discard;
          gl_FragColor = vec4(vColor * tex.rgb, a);
        }
      `
    });
    const partPoints = new THREE.Points(partGeom, partMat);
    partPoints.frustumCulled = false;
    partPoints.renderOrder = 3;
    scene.add(partPoints);

    function spawnParticle(x, y, z, vx, vy, vz, s0, s1, life, grav, r, g, b, alpha) {
      const idx = pCursor;
      pCursor = (pCursor + 1) % MAX_PARTICLES;
      const d = pData[idx];
      d.active = true;
      d.vx = vx; d.vy = vy; d.vz = vz;
      d.life = 0; d.maxLife = life;
      d.s0 = s0; d.s1 = s1;
      d.grav = grav;
      d.fade = alpha;
      pPos[idx * 3] = x;
      pPos[idx * 3 + 1] = y;
      pPos[idx * 3 + 2] = z;
      pCol[idx * 3] = r;
      pCol[idx * 3 + 1] = g;
      pCol[idx * 3 + 2] = b;
      pSize[idx] = s0;
      pAlpha[idx] = alpha;
    }

    function spawnSnowBurst(x, y, z, count, spread, upVel, sizeBoost) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (0.3 + Math.random() * 0.7) * spread;
        spawnParticle(
          x + (Math.random() - 0.5) * 0.9,
          y + 0.15 + Math.random() * 0.35,
          z + (Math.random() - 0.5) * 0.9,
          Math.cos(a) * sp,
          upVel * (0.45 + Math.random() * 0.75),
          Math.sin(a) * sp,
          (0.65 + Math.random() * 0.65) * sizeBoost,
          (1.8 + Math.random() * 1.6) * sizeBoost,
          0.42 + Math.random() * 0.38,
          10.5,
          0.98, 0.99, 1.0,
          0.74
        );
      }
    }

    function spawnGoldBurst(x, y, z, count) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2.5 + Math.random() * 6.5;
        spawnParticle(
          x + (Math.random() - 0.5) * 1.4,
          y + Math.random() * 1.5,
          z + (Math.random() - 0.5) * 0.6,
          Math.cos(a) * sp,
          3.2 + Math.random() * 6.0,
          Math.sin(a) * sp,
          0.48 + Math.random() * 0.45,
          0.14,
          0.48 + Math.random() * 0.38,
          8.5,
          1.0, 0.88, 0.45,
          0.95
        );
      }
    }

    function updateParticles(dt) {
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const d = pData[i];
        if (!d.active) continue;
        d.life += dt;
        if (d.life >= d.maxLife) {
          d.active = false;
          pAlpha[i] = 0;
          continue;
        }
        const t = d.life / d.maxLife;
        d.vy -= d.grav * dt;
        d.vx *= 1 - 1.4 * dt;
        d.vz *= 1 - 1.4 * dt;
        pPos[i * 3] += d.vx * dt;
        pPos[i * 3 + 1] += d.vy * dt;
        pPos[i * 3 + 2] += d.vz * dt;
        pSize[i] = lerp(d.s0, d.s1, t);
        pAlpha[i] = d.fade * (1 - t * t) * Math.min(1, t * 8);
      }
      partGeom.attributes.position.needsUpdate = true;
      partGeom.attributes.aColor.needsUpdate = true;
      partGeom.attributes.aSize.needsUpdate = true;
      partGeom.attributes.aAlpha.needsUpdate = true;
    }

    // Crisp sunlit atmospheric alpine snow crystals twinkling through mountain air
    const DUST_COUNT = 220;
    const dustPos = new Float32Array(DUST_COUNT * 3);
    const dustSeed = new Float32Array(DUST_COUNT);
    for (let i = 0; i < DUST_COUNT; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 68;
      dustPos[i * 3 + 1] = Math.random() * 24 - 6;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 76;
      dustSeed[i] = Math.random() * 100;
    }
    const dustGeom = new THREE.BufferGeometry();
    dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dustMat = new THREE.PointsMaterial({
      map: glintTex,
      color: 0xffffff,
      size: 0.44,
      transparent: true,
      opacity: 0.62,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const dustSystem = new THREE.Points(dustGeom, dustMat);
    dustSystem.frustumCulled = false;
    scene.add(dustSystem);

    function updateDust(cx, cy, cz, dt, time) {
      for (let i = 0; i < DUST_COUNT; i++) {
        const i3 = i * 3;
        dustPos[i3] += Math.sin(time * 0.7 + dustSeed[i]) * 1.4 * dt + 1.2 * dt;
        dustPos[i3 + 1] -= (1.3 + (dustSeed[i] % 1.4)) * dt;
        // Seamless cubic wrap relative to skier
        let dx = dustPos[i3] - cx;
        let dy = dustPos[i3 + 1] - cy;
        let dz = dustPos[i3 + 2] - cz;
        if (dx > 34) dustPos[i3] -= 68; else if (dx < -34) dustPos[i3] += 68;
        if (dy < -12) dustPos[i3 + 1] += 28; else if (dy > 16) dustPos[i3 + 1] -= 28;
        if (dz > 22) dustPos[i3 + 2] -= 76; else if (dz < -54) dustPos[i3 + 2] += 76;
      }
      dustGeom.attributes.position.needsUpdate = true;
    }

    /* ================================================================
       WORLD CHUNK STREAMING & CRAFTED ALPINE COURSE DESIGNER
       ================================================================ */
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    let chunks = [];
    let activeObstacles = [];  // { x, z, r, type, nearMissed }
    let activeGates = [];      // slalom gates
    let activeRamps = [];      // jump kickers
    let activeRings = [];      // mid-air gold rings
    let activeArches = [];     // scenic zone banners
    let activeLiftGondolas = [];
    let nextChunkZ = 18;
    let chunkIndex = 0;
    let lastLiftZ = null;
    let slalomSide = 1;
    let slalomRunLeft = 0;
    let slalomColorRed = true;
    let nextZoneArchDist = ZONE_DISTANCE;
    let courseRng = createRng(4207);

    function clearWorld() {
      while (worldGroup.children.length > 0) {
        worldGroup.remove(worldGroup.children[0]);
      }
      activeArches.forEach((a) => {
        if (a.bannerTex) a.bannerTex.dispose();
        if (a.bannerMat) a.bannerMat.dispose();
      });
      chunks = [];
      activeObstacles = [];
      activeGates = [];
      activeRamps = [];
      activeRings = [];
      activeArches = [];
      activeLiftGondolas = [];
      nextChunkZ = 20;
      chunkIndex = 0;
      lastLiftZ = null;
      slalomSide = 1;
      slalomRunLeft = 0;
      slalomColorRed = true;
      nextZoneArchDist = ZONE_DISTANCE;
      worldSeedOffset = Math.floor(Math.random() * 4000);
      courseRng = createRng((Date.now() ^ 0x5f3759df) >>> 0);
      lastTerrainAnchor = Infinity;
    }

    function spawnPine(grp, x, z, scale, protoIdx, isHazard) {
      const m = pineProto[protoIdx % pineProto.length].clone();
      const y = getTerrainHeight(x, z);
      m.position.set(x, y - 0.12, z);
      m.scale.setScalar(scale);
      m.rotation.y = courseRng() * Math.PI * 2;
      // Subtle graceful tilt matching organic mountain forests
      m.rotation.z = (courseRng() - 0.5) * 0.06;
      grp.add(m);
      if (isHazard) {
        activeObstacles.push({ x, z, r: 1.05 * scale, type: 'pine', nearMissed: false });
      }
    }

    function spawnChunk() {
      const z0 = nextChunkZ;
      const z1 = z0 - CHUNK_LEN;
      nextChunkZ = z1;
      const idx = chunkIndex++;
      const dist = Math.max(0, -z0);
      const difficulty = clamp(dist / 2400, 0, 1);
      const safeIntro = z0 > -36; // Pristine dramatic sunlit sightline right off start!

      const grp = new THREE.Group();
      const chunkGates = [];
      const chunkRamps = [];
      const chunkRings = [];
      const chunkArches = [];
      const chunkGondolas = [];
      const keptLanes = []; // Keep clear obstacle-free lines through gates and landing zones

      // 1. Scenic rich alpine pine walls bordering BOTH edges of the groomed valley
      const edgeCount = 13;
      for (let i = 0; i < edgeCount; i++) {
        const tz = z0 - courseRng() * CHUNK_LEN;
        const side = i % 2 === 0 ? -1 : 1;
        // Layered forest belts: inner piste edge frames view + lush hillside upper conifers
        const nearBand = courseRng() < 0.52;
        const offset = nearBand
          ? PISTE_HALF + 2.6 + courseRng() * 12
          : PISTE_HALF + 14 + courseRng() * 34;
        const px = getCenterX(tz) + side * offset;
        const sc = nearBand ? (0.88 + courseRng() * 0.62) : (1.1 + courseRng() * 0.9);
        const isEdgeHazard = offset < PISTE_HALF + 11.5;
        spawnPine(grp, px, tz, sc, i + idx, isEdgeHazard);
      }

      // Dramatic alpine red-orange race nets accenting brisk outer bends
      const bendRate = getCenterSlopeX(z0 - CHUNK_LEN * 0.5);
      if (Math.abs(bendRate) > 0.14 && courseRng() < 0.68) {
        const outerSide = bendRate > 0 ? -1 : 1;
        grp.add(createCornerFence(z0 - 8, outerSide));
      }

      // 2. Rhythmic scenic resort ski-lift every 2 chunks on left alpine shelf
      if (idx % 2 === 0) {
        const lz = z0 - CHUNK_LEN * 0.5;
        const lt = createLiftTower(lz, lastLiftZ);
        grp.add(lt.group);
        if (lt.gondola) {
          chunkGondolas.push({ obj: lt.gondola, phase: lt.phase });
          activeLiftGondolas.push({ obj: lt.gondola, phase: lt.phase });
        }
        lastLiftZ = lz;
      }

      // Cozy Swiss alpine wooden chalets perched quietly high beside the sunlit slope!
      if (idx === 1 || (idx > 2 && idx % 5 === 0)) {
        const cz = z0 - CHUNK_LEN * 0.62;
        const onRight = idx % 10 !== 0;
        const cxOff = onRight ? (PISTE_HALF + 13.5) : -(PISTE_HALF + 16.5);
        grp.add(createAlpineChalet(getCenterX(cz) + cxOff, cz, onRight));
      }

      // 3. Zone milestone wooden race arch spanning wide across the whole piste
      if (dist >= nextZoneArchDist && nextZoneArchDist > 0) {
        const zIdx = Math.round(nextZoneArchDist / ZONE_DISTANCE) % ZONES.length;
        const az = -nextZoneArchDist;
        const arch = createZoneArch(az, ZONES[zIdx].name);
        grp.add(arch.group);
        chunkArches.push(arch);
        activeArches.push(arch);
        keptLanes.push({ x: getCenterX(az), z: az, rx: 11, rz: 14 });
        nextZoneArchDist += ZONE_DISTANCE;
      }

      // 4. Thoughtfully paced rhythmic mountain features: Flowing Slaloms, Big-Air Kickers, Forest Glades
      if (!safeIntro) {
        const roll = courseRng();

        if (slalomRunLeft > 0 || (idx >= 2 && roll < 0.44)) {
          // Graceful sweeping alternating Red & Blue alpine racing slalom rhythm!
          if (slalomRunLeft <= 0) {
            slalomRunLeft = 2 + Math.floor(courseRng() * 2);
          }
          slalomRunLeft--;
          const gatesInChunk = 2;
          for (let g = 0; g < gatesInChunk; g++) {
            const gz = z0 - 9 - g * 19;
            const swing = lerp(5.2, 8.8, 0.35 + courseRng() * 0.5);
            const gx = getCenterX(gz) + slalomSide * swing;
            const halfGap = lerp(4.1, 3.25, difficulty);
            const gate = createSlalomGate(slalomColorRed, gx, gz, halfGap);
            grp.add(gate.group);
            chunkGates.push(gate);
            activeGates.push(gate);
            keptLanes.push({ x: gx, z: gz, rx: halfGap + 3.6, rz: 10 });
            slalomSide *= -1;
            slalomColorRed = !slalomColorRed;
          }
          // Subtle off-line pine framing outside the gate to guide lines beautifully
          const hz = z0 - CHUNK_LEN * 0.5;
          const hSide = courseRng() < 0.5 ? -1 : 1;
          const hx = getCenterX(hz) + hSide * (11.5 + courseRng() * 4.5);
          if (keptLanes.every((l) => Math.abs(hx - l.x) > l.rx || Math.abs(hz - l.z) > l.rz)) {
            if (courseRng() < 0.65) {
              spawnPine(grp, hx, hz, 0.85 + courseRng() * 0.4, idx + 1, true);
            }
          }
        } else if (roll < 0.72) {
          // Exhilarating wide groomed Big-Air Kicker jump with bright aerial bonus gold ring!
          const rz = z0 - 6;
          const rx = getCenterX(rz) + (courseRng() - 0.5) * 11;
          const width = 6.2;
          const length = 9.2;
          const liftH = 2.15 + courseRng() * 0.65;
          const withRing = courseRng() < 0.82;
          const ramp = createRamp(rx, rz, width, length, liftH, withRing);
          grp.add(ramp.group);
          chunkRamps.push(ramp);
          activeRamps.push(ramp);
          if (ramp.ring) {
            chunkRings.push(ramp.ring);
            activeRings.push(ramp.ring);
          }
          // Protect a lush completely clean sightline landing apron right past lip
          keptLanes.push({ x: rx, z: rz - length * 0.5, rx: 7.5, rz: 12 });
          keptLanes.push({ x: rx, z: rz - length - 14, rx: 8.5, rz: 18 });

          // Optional scenic risk-reward parallel slalom gate off to side
          const altSide = rx > getCenterX(rz) ? -1 : 1;
          const gx = getCenterX(rz - 18) + altSide * 10.2;
          const gate = createSlalomGate(slalomColorRed, gx, rz - 18, 3.6);
          grp.add(gate.group);
          chunkGates.push(gate);
          activeGates.push(gate);
          slalomColorRed = !slalomColorRed;
        } else {
          // Classic freeride alpine glade: contrasting pine pockets & bold snow-capped granite boulders
          const count = Math.round(lerp(2.2, 4.8, difficulty) + courseRng() * 1.4);
          const placed = [];
          for (let h = 0; h < count; h++) {
            const hz = z0 - 5 - courseRng() * (CHUNK_LEN - 9);
            const hx = getCenterX(hz) + (courseRng() * 2 - 1) * (PISTE_HALF - 2.2);
            // Guarantee rich navigable carve corridor between every obstacle (never an impossible wall!)
            let ok = true;
            for (const p of placed) {
              if (Math.hypot(hx - p.x, hz - p.z) < 8.4) { ok = false; break; }
            }
            for (const l of keptLanes) {
              if (Math.abs(hx - l.x) < l.rx && Math.abs(hz - l.z) < l.rz) { ok = false; break; }
            }
            // Don't block a prior chunk's fresh ramp landing apron
            for (const rm of activeRamps) {
              if (hz < rm.zEnd + 2 && hz > rm.zEnd - 24 && Math.abs(hx - rm.x) < 7.2) { ok = false; break; }
            }
            if (!ok) continue;
            placed.push({ x: hx, z: hz });
            if (courseRng() < 0.52) {
              const sc = 0.82 + courseRng() * 0.42;
              spawnPine(grp, hx, hz, sc, h + idx * 3, true);
            } else {
              const sc = 0.88 + courseRng() * 0.55;
              const rock = createBoulder(sc, idx * 31 + h * 7);
              rock.position.set(hx, getTerrainHeight(hx, hz) - 0.1, hz);
              grp.add(rock);
              activeObstacles.push({ x: hx, z: hz, r: 1.28 * sc, type: 'rock', nearMissed: false });
            }
          }
          // Tempting reward gate nestled inside the opening gap
          if (courseRng() < 0.55) {
            const gz = z0 - CHUNK_LEN * 0.52;
            const gx = getCenterX(gz) + (courseRng() - 0.5) * 10;
            const clear = placed.every((p) => Math.hypot(gx - p.x, gz - p.z) > 6.5);
            if (clear) {
              const gate = createSlalomGate(slalomColorRed, gx, gz, 3.8);
              grp.add(gate.group);
              chunkGates.push(gate);
              activeGates.push(gate);
              slalomColorRed = !slalomColorRed;
            }
          }
        }
      } else if (idx === 1) {
        // Immediate inspiring signature opener right in view on Title Screen: clean welcoming red & blue curve!
        const g1z = z0 - 12;
        const g1 = createSlalomGate(true, getCenterX(g1z) - 4.8, g1z, 4.4);
        grp.add(g1.group); chunkGates.push(g1); activeGates.push(g1);
        const g2z = z0 - 30;
        const g2 = createSlalomGate(false, getCenterX(g2z) + 5.2, g2z, 4.4);
        grp.add(g2.group); chunkGates.push(g2); activeGates.push(g2);
        slalomColorRed = true;
        slalomSide = -1;
      }

      worldGroup.add(grp);
      chunks.push({
        z0, z1, group: grp,
        gates: chunkGates, ramps: chunkRamps, rings: chunkRings,
        arches: chunkArches, gondolas: chunkGondolas
      });
    }

    function updateWorldStream(playerZ) {
      // Maintain lush populated slope 230m ahead so peaks & forests fade organically through fog
      while (nextChunkZ > playerZ - 235) {
        spawnChunk();
      }
      // Cleanly prune chunks scrolled cleanly behind camera
      const cullZ = playerZ + 44;
      while (chunks.length > 0 && chunks[0].z1 > cullZ) {
        const old = chunks.shift();
        worldGroup.remove(old.group);
        old.arches.forEach((a) => {
          if (a.bannerTex) a.bannerTex.dispose();
          if (a.bannerMat) a.bannerMat.dispose();
        });
      }
      if (activeObstacles.length > 140) {
        activeObstacles = activeObstacles.filter((o) => o.z < cullZ);
      }
      if (activeGates.length > 36) {
        activeGates = activeGates.filter((g) => g.z < cullZ);
      }
      if (activeRamps.length > 18) {
        activeRamps = activeRamps.filter((r) => r.zEnd < cullZ);
      }
      if (activeRings.length > 18) {
        activeRings = activeRings.filter((r) => r.z < cullZ);
      }
      if (activeArches.length > 6) {
        activeArches = activeArches.filter((a) => a.z < cullZ);
      }
      if (activeLiftGondolas.length > 14) {
        activeLiftGondolas = activeLiftGondolas.filter((g) => g.obj.parent && g.obj.parent.parent);
      }
    }

    // Exact surface height including smooth sculpted ramps
    function getRampAt(x, z) {
      for (let i = 0; i < activeRamps.length; i++) {
        const rm = activeRamps[i];
        if (z <= rm.zStart + 0.3 && z >= rm.zEnd - 0.25 && Math.abs(x - rm.x) <= rm.hw + 0.25) {
          const t = clamp((rm.zStart - z) / rm.length, 0, 1);
          const lift = Math.pow(t, 1.55) * rm.liftH;
          const upSlope = (1.55 * Math.pow(Math.max(0.05, t), 0.55) * rm.liftH) / rm.length;
          return { ramp: rm, lift, upSlope, t };
        }
      }
      return null;
    }

    /* ================================================================
       INPUT HANDLING (Keyboard + Smooth Pointer/Touch Drag)
       ================================================================ */
    const keys = { left: false, right: false, up: false, down: false };
    let pointerSteer = 0; // -1..1 continuous touch/drag carving
    let activeTouchId = null;
    let touchAnchorX = 0;
    let touchActive = false;

    function queueJump() {
      state.jumpBuffer = 0.16;
    }

    window.addEventListener('keydown', (e) => {
      const k = e.code;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(k)) {
        e.preventDefault();
      }
      if (k === 'KeyM') {
        toggleSound();
        return;
      }
      if (k === 'KeyP' || k === 'Escape') {
        if (state.mode === 'playing') setPaused(true);
        else if (state.mode === 'paused') setPaused(false);
        return;
      }
      if (state.mode === 'title' && (k === 'Space' || k === 'Enter')) {
        startRun();
        return;
      }
      if (state.mode === 'gameover' && (k === 'Space' || k === 'Enter' || k === 'KeyR')) {
        startRun();
        return;
      }
      if (state.mode === 'paused') {
        if (k === 'Space' || k === 'Enter') { setPaused(false); return; }
        if (k === 'KeyR') { startRun(); return; }
      }
      if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
      if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
      if (k === 'ArrowUp' || k === 'KeyW') keys.up = true;
      if (k === 'ArrowDown' || k === 'KeyS') keys.down = true;
      if (k === 'Space' && !e.repeat && state.mode === 'playing') {
        queueJump();
      }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
      const k = e.code;
      if (k === 'ArrowLeft' || k === 'KeyA') keys.left = false;
      if (k === 'ArrowRight' || k === 'KeyD') keys.right = false;
      if (k === 'ArrowUp' || k === 'KeyW') keys.up = false;
      if (k === 'ArrowDown' || k === 'KeyS') keys.down = false;
    });

    window.addEventListener('blur', () => {
      keys.left = keys.right = keys.up = keys.down = false;
      pointerSteer = 0;
      touchActive = false;
    });

    // Mobile / mouse touch-drag responsive carving right on the snow slope
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (state.mode !== 'playing') return;
      audio.unlock();
      touchActive = true;
      activeTouchId = e.pointerId;
      touchAnchorX = e.clientX;
      pointerSteer = 0;
    });

    window.addEventListener('pointermove', (e) => {
      if (!touchActive || e.pointerId !== activeTouchId || state.mode !== 'playing') return;
      const dx = e.clientX - touchAnchorX;
      // Right drag (+dx) steers right (+1), left drag (-dx) steers left (-1)
      pointerSteer = clamp(dx / Math.min(130, window.innerWidth * 0.24), -1, 1);
    });

    window.addEventListener('pointerup', (e) => {
      if (e.pointerId === activeTouchId) {
        touchActive = false;
        activeTouchId = null;
        pointerSteer = 0;
      }
    });

    document.getElementById('touch-jump').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      audio.unlock();
      if (state.mode === 'playing') queueJump();
    });

    // UI button events

    document.getElementById('btn-resume').addEventListener('click', () => setPaused(false));
    document.getElementById('btn-pause-restart').addEventListener('click', () => startRun());
    document.getElementById('btn-pause').addEventListener('click', () => {

    });

    function toggleSound() {
      audio.unlock();
      audio.setMuted(!audio.muted);
      elSoundOn.style.display = audio.muted ? 'none' : '';
      elSoundOff.style.display = audio.muted ? '' : 'none';

    /* ================================================================
       LIGHTING & ZONE ATMOSPHERE BLENDING
       ================================================================ */
    const _colA = new THREE.Color();
    const _sunDir = new THREE.Vector3();
    const _mLit = new THREE.Color();
    const _mShd = new THREE.Color();
    const _mBas = new THREE.Color();
    const _mHor = new THREE.Color();

    function applyAtmosphere(dist, forceMountains) {
      const cyclePos = dist / ZONE_DISTANCE;
      const i0 = Math.floor(cyclePos) % ZONES.length;
      const i1 = (i0 + 1) % ZONES.length;
      const frac = cyclePos - Math.floor(cyclePos);
      // Long crisp clear plateau per zone, silky painterly sunset shift in final 24%
      const blend = smoothstep(0.76, 1.0, frac);

      const z0 = ZONES[i0];
      const z1 = ZONES[i1];

      skyUniforms.uTopColor.value.copy(z0.skyTop).lerp(z1.skyTop, blend);
      skyUniforms.uMidColor.value.copy(z0.skyMid).lerp(z1.skyMid, blend);
      skyUniforms.uHorizonColor.value.copy(z0.skyHorizon).lerp(z1.skyHorizon, blend);
      skyUniforms.uSunColor.value.copy(z0.sunColor).lerp(z1.sunColor, blend);
      skyUniforms.uCloudColor.value.copy(z0.cloudColor).lerp(z1.cloudColor, blend);
      _sunDir.copy(z0.sunDir).lerp(z1.sunDir, blend).normalize();
      skyUniforms.uSunDir.value.copy(_sunDir);
      skyUniforms.uStars.value = lerp(z0.starAmount, z1.starAmount, blend);

      sunLight.color.copy(z0.sunColor).lerp(z1.sunColor, blend);
      sunLight.intensity = lerp(z0.sunInt, z1.sunInt, blend);
      hemiLight.color.copy(z0.hemiSky).lerp(z1.hemiSky, blend);
      hemiLight.groundColor.copy(z0.hemiGround).lerp(z1.hemiGround, blend);
      hemiLight.intensity = lerp(z0.hemiInt, z1.hemiInt, blend);

      scene.fog.color.copy(z0.fogColor).lerp(z1.fogColor, blend);
      scene.fog.density = lerp(z0.fogDensity, z1.fogDensity, blend);

      state.curSnowLit.copy(z0.snowLight).lerp(z1.snowLight, blend);
      state.curSnowSide.copy(z0.snowSide).lerp(z1.snowSide, blend);
      state.curBeacon = lerp(z0.beaconGlow, z1.beaconGlow, blend);

      // Tint recessed ski tracks, terrain sunlight crystal glint & glowing warm chalet panes smoothly across day-to-dusk
      trackL.mat.uniforms.uColor.value.copy(hemiLight.groundColor).multiplyScalar(0.84);
      trackR.mat.uniforms.uColor.value.copy(trackL.mat.uniforms.uColor.value);
      terrainSparkleUniforms.uSunCol.value.copy(sunLight.color);
      terrainSparkleUniforms.uSunVec.value.copy(_sunDir);
      chaletWinMat.color.setHex(state.curBeacon > 0.2 ? 0xffcf6a : 0xfff0c8);

      // Update massive backdrop peak shading during transitions & on init
      if (forceMountains || blend > 0.001 || Math.abs(dist - state.lastLitUpdate) > 90) {
        _mLit.copy(z0.peakLit).lerp(z1.peakLit, blend);
        _mShd.copy(z0.peakShadow).lerp(z1.peakShadow, blend);
        _mBas.copy(z0.peakBase).lerp(z1.peakBase, blend);
        _mHor.copy(skyUniforms.uHorizonColor.value);
        updateMountainColors(_mLit, _mShd, _mBas, _mHor);
        state.lastLitUpdate = dist;
      }

      // Announce dramatic fresh zone crossing cleanly with gentle burst & sparkling golden snow
      if (state.mode === 'playing' && i0 !== state.currentZone) {
        state.currentZone = i0;
        showZone(ZONES[i0].name);
        audio.playZoneChime();
        state.score += 250 * state.combo;
        state.boostTimer = Math.max(state.boostTimer, 1.2);
        state.comboTimer = state.comboMax;
        spawnGoldBurst(state.x, state.y + 1.8, state.z - 2, 22);
      }
    }

    /* ================================================================
       LIFECYCLE: TITLE DEMO / START / PAUSE / GAMEOVER
       ================================================================ */
    function resetCourse(asMode) {
      clearWorld();
      clearTracks();
      state.mode = asMode;
      state.hitStop = 0;
      state.z = 0;
      state.x = getCenterX(0);
      state.y = getTerrainHeight(state.x, state.z);
      state.vx = 0;
      state.vy = 0;
      state.speed = asMode === 'title' ? 23.5 : 22.0;
      state.heading = 0;
      state.lean = 0;
      state.tuck = 0;
      state.brake = 0;
      state.grounded = true;
      state.onRamp = false;
      state.coyoteTimer = 0;
      state.jumpBuffer = 0;
      state.airTime = 0;
      state.airPeakH = 0;
      state.spinAngle = 0;
      state.flipAngle = 0;
      state.spinVel = 0;
      state.flipVel = 0;
      state.squash = 0;
      state.squashVel = 0;
      state.boostTimer = 0;
      state.invulnTimer = 0;
      state.tumbleTimer = 0;
      state.camShake = 0;
      state.score = 0;
      state.dist = 0;
      state.maxSpeedKmh = 0;
      state.gatesCleared = 0;
      state.tricksLanded = 0;
      state.combo = 1;
      state.comboTimer = 0;
      state.lives = 3;
      state.currentZone = 0;
      keys.left = keys.right = keys.up = keys.down = false;
      pointerSteer = 0;
      touchActive = false;
      skier.root.visible = true;
      skier.trickPivot.rotation.set(0, 0, 0);

      // Zero out residual particles cleanly
      for (let i = 0; i < MAX_PARTICLES; i++) {
        pData[i].active = false;
        pAlpha[i] = 0;
      }
      updateParticles(0.016);

      // Populate crisp immediate mountain ahead & lock first-frame camera
      updateWorldStream(state.z);
      applyAtmosphere(0, true);
      updateTerrainMesh(Math.floor(state.z / TERRAIN_STEP_Z) * TERRAIN_STEP_Z, state.curSnowLit, state.curSnowSide);
      lastTerrainAnchor = state.z;

      if (asMode === 'title') {
        state.camPos.set(state.x + 3.4, state.y + 4.4, state.z + 9.2);
        state.camLook.set(state.x - 1.2, state.y - 2.6, state.z - 22);
        state.camFov = 58;
      } else {
        state.camPos.set(state.x, state.y + 4.9, state.z + 9.6);
        state.camLook.set(state.x, state.y - 2.4, state.z - 22);
        state.camFov = 60;
      }
      camera.fov = state.camFov;
      camera.updateProjectionMatrix();
      camera.position.copy(state.camPos);
      camera.lookAt(state.camLook);

      refreshLives();
      elScore.textContent = '0';
      elMult.classList.remove('active');
      elComboBar.classList.remove('active');
      elSpeedLines.style.opacity = '0';
      elCallout.classList.remove('show');
      elZoneBanner.classList.remove('show');
    }

    function startRun() {
      audio.unlock();
      resetCourse('playing');
      elTitle.classList.add('hidden');
      elGameOver.classList.remove('visible');
      elPause.classList.remove('visible');
      elHud.classList.add('visible');
      showZone(ZONES[0].name);
      audio.playJump(false);
    }

    function setPaused(p) {
      if (p) {
        state.mode = 'paused';
        elPause.classList.add('visible');
        audio.updateContinuous(0, 0, false, false, false, 0.016);
      } else {
        state.mode = 'playing';
        elPause.classList.remove('visible');
        lastTime = performance.now();
      }
    }

    function triggerGameOver() {
      state.mode = 'gameover';
      elHud.classList.remove('visible');
      elSpeedLines.style.opacity = '0';
      audio.updateContinuous(0, 0, false, false, false, 0.016);

      const finalScore = Math.floor(state.score);
      const finalDist = Math.floor(state.dist);
      const best = loadBest();
      const isNew = finalScore > best.score;
      if (isNew || finalDist > best.dist) {
        saveBest(Math.max(finalScore, best.score), Math.max(finalDist, best.dist));
        refreshTitleBest();
      }

      elGoScore.textContent = finalScore.toLocaleString();
      elGoDist.textContent = finalDist.toLocaleString() + 'm';
      elGoSpeed.textContent = Math.round(state.maxSpeedKmh);
      elGoGates.textContent = state.gatesCleared;
      elGoBadge.textContent = isNew && finalScore > 0 ? 'New Personal Best' : (best.score > 0 ? `Best ${best.score.toLocaleString()}` : '');
      elGameOver.classList.add('visible');
    }

    /* ================================================================
       TITLE-SCREEN AUTOPILOT CARVING AI (Graceful Scenic S-Turns)
       ================================================================ */
    function computeAutopilotSteer() {
      // Gently pursue upcoming gates while gliding right around boulders & pines
      let targetX = getCenterX(state.z - 22) + Math.sin(state.time * 0.85) * 6.2;

      // Pick nearest ahead slalom gate for flowing photographic carving!
      let bestGate = null;
      let bestDist = 38;
      for (let i = 0; i < activeGates.length; i++) {
        const g = activeGates[i];
        const dz = state.z - g.z;
        if (dz > 3 && dz < bestDist) {
          bestDist = dz;
          bestGate = g;
        }
      }
      if (bestGate) targetX = bestGate.x;

      // Softly steer away from immediate hazards
      for (let i = 0; i < activeObstacles.length; i++) {
        const o = activeObstacles[i];
        const dz = state.z - o.z;
        if (dz > 1 && dz < 22) {
          const dx = targetX - o.x;
          if (Math.abs(dx) < o.r + 3.4) {
            targetX = o.x + (dx >= 0 ? o.r + 4.4 : -(o.r + 4.4));
          }
        }
      }
      const err = targetX - state.x;
      return clamp(err * 0.14, -0.88, 0.88);
    }

    /* ================================================================
       CORE PHYSICS STEP
       ================================================================ */
    const _norm = new THREE.Vector3();

    function stepSimulation(dt) {
      state.time += dt;
      skyUniforms.uTime.value = state.time;

      if (state.hitStop > 0) {
        state.hitStop -= dt;
        return;
      }

      const isTitle = state.mode === 'title';
      const isPlaying = state.mode === 'playing';

      // Input calculation: -1 left (-X), +1 right (+X)
      let steer = 0;
      let wantTuck = false;
      let wantBrake = false;
      if (isPlaying) {
        if (keys.left) steer -= 1;
        if (keys.right) steer += 1;
        if (touchActive && Math.abs(pointerSteer) > 0.04) steer = pointerSteer;
        wantTuck = keys.up && !keys.down;
        wantBrake = keys.down && !keys.up;
      } else if (isTitle) {
        steer = computeAutopilotSteer();
      } else {
        // Gentle scenic slow roll after gameover
        state.speed = damp(state.speed, 0, 2.8, dt);
        updateParticles(dt);
        return;
      }

      // Smoothly ramp speed baseline along mountain descent (exciting progression!)
      const progBonus = isPlaying ? Math.min(18, state.dist * 0.0046) : 0;
      const baseCruise = isTitle ? 24.5 : (27.5 + progBonus);
      const tuckTarget = (wantTuck && state.grounded) ? 1 : 0;
      const brakeTarget = (wantBrake && state.grounded) ? 1 : 0;
      state.tuck = damp(state.tuck, tuckTarget, 8, dt);
      state.brake = damp(state.brake, brakeTarget, 9, dt);

      if (state.boostTimer > 0) state.boostTimer = Math.max(0, state.boostTimer - dt);
      if (state.invulnTimer > 0) state.invulnTimer = Math.max(0, state.invulnTimer - dt);
      if (state.tumbleTimer > 0) state.tumbleTimer = Math.max(0, state.tumbleTimer - dt);
      if (state.jumpBuffer > 0) state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
      if (state.coyoteTimer > 0) state.coyoteTimer = Math.max(0, state.coyoteTimer - dt);
      if (state.camShake > 0) state.camShake = Math.max(0, state.camShake - dt * 2.6);

      // Heading carving (note: turning sharp sheds a tiny realistic dash of speed, tuck bombs down hill!)
      const maxHeading = 0.66;
      const turnResp = state.grounded ? (6.4 + state.brake * 2.2) : 2.1;
      const targetHeading = -steer * maxHeading; // negative heading turns toward +X
      state.heading = damp(state.heading, targetHeading, turnResp, dt);

      // Real kinetic downhill feel: gravity pushes up speed faster on steeper downward faces
      const aheadSlope = (getTerrainHeight(state.x, state.z) - getTerrainHeight(state.x, state.z - 4)) / 4;
      const slopeBoost = (aheadSlope - SLOPE_TAN) * 26;
      const carveDrag = Math.abs(state.heading) * 6.2;
      const boostAdd = state.boostTimer > 0 ? 7.8 * Math.min(1, state.boostTimer * 1.4) : 0;

      let targetSpeed = baseCruise + slopeBoost + state.tuck * 12.2 - state.brake * 12.8 - carveDrag + boostAdd;
      if (state.tumbleTimer > 0) targetSpeed *= 0.62;
      targetSpeed = clamp(targetSpeed, isTitle ? 20 : 14.5, 52);

      const accelRate = state.grounded ? (state.brake > 0.3 ? 4.4 : 2.1) : 0.25;
      state.speed = damp(state.speed, targetSpeed, accelRate, dt);

      // Real carving horizontal velocity driven effortlessly by ski heading
      const forwardVz = -state.speed * Math.cos(state.heading * 0.85);
      const carveVx = -Math.sin(state.heading) * state.speed * 1.06;
      state.vx = damp(state.vx, carveVx, state.grounded ? 9.5 : 1.8, dt);

      // Update XZ coordinates
      const prevZ = state.z;
      const prevY = state.y;
      const prevRampInfo = getRampAt(state.x, state.z);
      state.x += state.vx * dt;
      state.z += forwardVz * dt;

      // Natural sweeping valley walls smoothly funnel skier back inside playable ridge (no dead hard wall!)
      const cx = getCenterX(state.z);
      const relX = state.x - cx;
      if (Math.abs(relX) > MAX_X_OFFSET) {
        const s = Math.sign(relX);
        state.x = cx + s * MAX_X_OFFSET;
        if (Math.sign(state.vx) === s) state.vx *= -0.3;
        state.heading = damp(state.heading, s * 0.25, 10, dt);
      } else if (Math.abs(relX) > PISTE_HALF + 3.5) {
        // Soft natural hillside banking bends the skier organically back toward open valley
        const push = (Math.abs(relX) - (PISTE_HALF + 3.5)) * 1.4;
        state.vx -= Math.sign(relX) * push * dt;
      }

      // Compute continuous ground + ramp altitude beneath skier
      const groundH = getTerrainHeight(state.x, state.z);
      const rampInfo = getRampAt(state.x, state.z);
      const surfH = rampInfo ? groundH + rampInfo.lift : groundH;

      // Did we cleanly soar right off the upward lip of a ski-park kicker ramp?
      if (state.grounded && prevRampInfo && !rampInfo && state.z < prevRampInfo.ramp.zEnd + 0.4) {
        const launchVy = clamp(state.speed * (prevRampInfo.upSlope + 0.16), 9.6, 17.2);
        state.vy = launchVy;
        state.grounded = false;
        state.onRamp = false;
        state.airTime = 0;
        state.airPeakH = 0;
        state.spinAngle = 0;
        state.flipAngle = 0;
        state.spinVel = 0;
        state.flipVel = 0;
        state.coyoteTimer = 0;
        state.boostTimer = Math.max(state.boostTimer, 0.9);
        audio.playJump(true);
        spawnSnowBurst(state.x, surfH + 0.2, state.z, 16, 4.4, 4.2, 1.0);
        if (isTitle) state.spinVel = 5.2; // Hero title skier even styles a sweet smooth 360!
      } else if (state.grounded) {
        // Responsive Ollie / Pop jump anytime grounded (boosted extra strongly off a ramp!)
        if (state.jumpBuffer > 0 && isPlaying) {
          state.jumpBuffer = 0;
          const rampBonus = rampInfo ? (5.2 + rampInfo.t * 4.5) : 0;
          state.vy = 9.2 + rampBonus;
          state.y = surfH + 0.18;
          state.grounded = false;
          state.onRamp = false;
          state.airTime = 0;
          state.airPeakH = 0;
          state.spinAngle = 0;
          state.flipAngle = 0;
          state.spinVel = 0;
          state.flipVel = 0;
          audio.playJump(Boolean(rampInfo));
          spawnSnowBurst(state.x, surfH + 0.1, state.z, 12, 3.6, 3.2, 0.85);
        } else {
          // Track natural crest pop if bombing mega fast over sharp downhill roller lip
          const naturalVy = (surfH - prevY) / Math.max(dt, 0.001);
          const groundNext = getTerrainHeight(state.x, state.z - 1.5);
          const slopeDrop = surfH - groundNext;
          if (!rampInfo && state.speed > 36 && slopeDrop > 0.72 && state.vy - naturalVy > 3.6) {
            state.grounded = false;
            state.coyoteTimer = 0.15;
            state.airTime = 0;
            state.airPeakH = 0;
            state.spinAngle = 0;
            state.flipAngle = 0;
          } else {
            state.vy = clamp(naturalVy, -26, 20);
            state.y = surfH;
            state.onRamp = Boolean(rampInfo);
            state.coyoteTimer = 0.14;
            // Smoothly return any small air trick angle cleanly back to zero
            state.spinAngle = damp(state.spinAngle, 0, 14, dt);
            state.flipAngle = damp(state.flipAngle, 0, 14, dt);
          }
        }
      } else {
        // Glorious lofty airborne arc with responsive style tricks!
        if (state.jumpBuffer > 0 && state.coyoteTimer > 0 && isPlaying) {
          state.jumpBuffer = 0;
          state.coyoteTimer = 0;
          state.vy = Math.max(state.vy, 9.4);
          audio.playJump(false);
        }
        const GRAV = 21.8; // Crisp athletic hangtime — slightly floaty like SSX/Alto's Adventure!
        state.vy -= GRAV * dt;
        state.y += state.vy * dt;
        state.airTime += dt;
        const above = state.y - surfH;
        if (above > state.airPeakH) state.airPeakH = above;

        // Air spins (A/D) & crisp alpine backflip / frontflip (W/S)
        if (isPlaying && state.airTime > 0.06) {
          const wantSpin = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
          const wantFlip = (keys.down ? 1 : 0) - (keys.up ? 1 : 0); // S = stylish backflip, W = dynamic frontflip
          if (wantSpin !== 0) {
            state.spinVel = damp(state.spinVel, wantSpin * 6.8, 10, dt);
          } else {
            // Assist gently snapping cleanly to nearest crisp full 360° landing!
            const nearest = Math.round(state.spinAngle / (Math.PI * 2)) * Math.PI * 2;
            state.spinVel = damp(state.spinVel, clamp((nearest - state.spinAngle) * 5.2, -5.5, 5.5), 8, dt);
          }
          if (wantFlip !== 0) {
            state.flipVel = damp(state.flipVel, wantFlip * 6.4, 10, dt);
          } else {
            const nearest = Math.round(state.flipAngle / (Math.PI * 2)) * Math.PI * 2;
            state.flipVel = damp(state.flipVel, clamp((nearest - state.flipAngle) * 5.8, -5.5, 5.5), 8, dt);
          }
          state.spinAngle += state.spinVel * dt;
          state.flipAngle += state.flipVel * dt;
        } else if (isTitle) {
          state.spinAngle += state.spinVel * dt;
          if (Math.abs(state.spinAngle) >= Math.PI * 2) {
            state.spinAngle = 0;
            state.spinVel = 0;
          }
        }

        // Touchdown detection & crisp heroic powder stomp!
        if (state.y <= surfH) {
          state.y = surfH;
          const impactSpeed = Math.max(0, -state.vy);
          state.grounded = true;
          state.onRamp = Boolean(rampInfo);
          state.squash = clamp(impactSpeed * 0.028, 0.14, 0.44);
          state.squashVel = 0;

          // Tally stylish spun degrees & flips completed cleanly!
          const spins = Math.round(Math.abs(state.spinAngle) / (Math.PI * 2));
          const flips = Math.round(Math.abs(state.flipAngle) / (Math.PI * 2));
          const isBack = state.flipAngle > 0;
          const bigAir = state.airTime > 0.78 && state.airPeakH > 2.2;
          let trickBonus = 0;
          let label = '';

          if (isPlaying && (spins > 0 || flips > 0 || bigAir)) {
            const parts = [];
            if (flips > 0) {
              const fn = flips > 1 ? `${flips}× ` : '';
              parts.push(fn + (isBack ? 'Backflip' : 'Frontflip'));
              trickBonus += flips * 420;
            }
            if (spins > 0) {
              parts.push(`${spins * 360}°`);
              trickBonus += spins * 320;
            }
            if (parts.length === 0 && bigAir) {
              parts.push('Big Air');
              trickBonus += Math.round(state.airPeakH * 42);
            }
            label = parts.join(' + ');
            const totalPts = trickBonus * state.combo;
            state.score += totalPts;
            state.tricksLanded += (spins + flips || 1);
            state.boostTimer = Math.max(state.boostTimer, 1.35);
            state.comboTimer = state.comboMax;
            if (flips > 0 || spins > 0) {
              state.combo = Math.min(12, state.combo + 1);
              popMult();
            }
            showCallout(label, `+${totalPts.toLocaleString()}`, true);
            spawnGoldBurst(state.x, state.y + 0.5, state.z, 18);
          }

          const anyTrick = trickBonus > 0;
          audio.playLand(clamp(impactSpeed / 18, 0.25, 1.0), anyTrick);
          spawnSnowBurst(state.x, state.y + 0.1, state.z, anyTrick ? 28 : 16, anyTrick ? 6.6 : 4.5, 4.6, anyTrick ? 1.25 : 0.95);
          state.camShake = Math.max(state.camShake, clamp(impactSpeed * 0.018, 0.08, 0.36));
          state.spinAngle = 0;
          state.flipAngle = 0;
          state.spinVel = 0;
          state.flipVel = 0;
          state.vy = 0;
        }
      }

      // Elastic squash & knee-compression spring return
      state.squash = damp(state.squash, 0, 11, dt);

      // Update distance & live cruise score
      const dzMoved = prevZ - state.z;
      state.dist = Math.max(0, -state.z);
      const kmh = state.speed * 3.15; // Crisp exhilarating authentic downhill radar scale (~70-155 km/h)
      if (isPlaying) {
        if (kmh > state.maxSpeedKmh) state.maxSpeedKmh = kmh;
        state.score += dzMoved * 0.85 * (1 + (state.combo - 1) * 0.35);
        // Smooth combo timer bleed
        if (state.combo > 1) {
          state.comboTimer -= dt;
          if (state.comboTimer <= 0) {
            state.combo = 1;
            state.comboTimer = 0;
          }
        }
      }

      // -----------------------------------------------------------
      // COLLISIONS & GENEROUS REWARDS (Gates, Gold Rings, Obstacles)
      // -----------------------------------------------------------
      // 1. Slalom gates (sweep-checked across prevZ..z so zero tunneling at 150 km/h!)
      for (let i = 0; i < activeGates.length; i++) {
        const g = activeGates[i];
        if (!g.passed && prevZ >= g.z && state.z <= g.z) {
          const dx = Math.abs(state.x - g.x);
          if (dx <= g.halfGap + 0.45) {
            g.passed = true;
            // Brush inner pole for authentic World Cup slalom ski deflection!
            const nearPole = Math.abs(dx - g.halfGap) < 1.05;
            if (nearPole) {
              const pIdx = state.x < g.x ? 0 : 1;
              g.poles[pIdx].bendVel = -11.5;
              audio.playGateTap();
            }
            if (isPlaying) {
              state.gatesCleared++;
              state.combo = Math.min(12, state.combo + 1);
              state.comboTimer = state.comboMax;
              const pts = (nearPole ? 180 : 120) * state.combo;
              state.score += pts;
              state.boostTimer = Math.max(state.boostTimer, 0.72);
              popMult();
              audio.playGate(state.combo, nearPole);
              // Swap flag glow gold cleanly as visual sign of clean link!
              g.flags.forEach((f) => { f.mesh.material = sharedMat.flagCleared; });
              spawnGoldBurst(state.x, state.y + 1.2, g.z, nearPole ? 16 : 10);
              if (nearPole) {
                showCallout('Tight Line', `+${pts.toLocaleString()}`, true);
              } else if (state.combo >= 4 && state.combo % 3 === 0) {
                showCallout(`${state.combo}× Flow`, `+${pts.toLocaleString()}`, false);
              }
            }
          }
        }
      }

      // 2. Airborne gold alpine bonus rings above big kickers
      if (isPlaying) {
        for (let i = 0; i < activeRings.length; i++) {
          const rg = activeRings[i];
          if (rg.collected) continue;
          if (prevZ >= rg.z - 1.2 && state.z <= rg.z + 1.2) {
            const distXY = Math.hypot(state.x - rg.x, (state.y + 1.0) - rg.y);
            if (distXY < 3.4) {
              rg.collected = true;
              rg.mesh.visible = false;
              state.combo = Math.min(12, state.combo + 2);
              state.comboTimer = state.comboMax;
              const pts = 500 * state.combo;
              state.score += pts;
              state.boostTimer = Math.max(state.boostTimer, 1.4);
              popMult();
              audio.playRing();
              spawnGoldBurst(rg.x, rg.y, rg.z, 26);
              showCallout('Summit Ring', `+${pts.toLocaleString()}`, true);
            }
          }
        }
      }

      // 3. Solid obstacles (player-favored inner hitbox + heroic close-call thrill reward!)
      if (isPlaying && state.invulnTimer <= 0) {
        const skierAbove = state.y - groundH;
        for (let i = 0; i < activeObstacles.length; i++) {
          const o = activeObstacles[i];
          const dz = Math.abs(state.z - o.z);
          if (dz > 2.6) continue;
          const maxClearH = o.type === 'rock' ? 1.9 : 5.4;
          if (skierAbove > maxClearH) continue;
          const d = Math.hypot(state.x - o.x, state.z - o.z);
          const hitR = o.r * 0.72 + 0.35; // Tight generous true hitbox
          if (d < hitR) {
            // Dramatic punchy impact with crisp hit-stop & forgiving shield recovery!
            state.lives--;
            refreshLives();
            state.combo = 1;
            state.comboTimer = 0;
            state.hitStop = 0.048;
            state.camShake = 0.78;
            state.invulnTimer = 2.3;
            state.tumbleTimer = 0.65;
            state.speed = Math.max(15, state.speed * 0.52);
            // Gently bounce clear off trunk/boulder side so never stuck
            const pushDir = state.x >= o.x ? 1 : -1;
            state.x += pushDir * 1.3;
            state.vx = pushDir * 7.5;
            flashDamage();
            audio.playCrash();
            spawnSnowBurst(state.x, state.y + 0.7, state.z, 38, 9.0, 7.2, 1.45);
            if (state.lives <= 0) {
              triggerGameOver();
            }
            break;
          } else if (!o.nearMissed && state.z < o.z && d < hitR + 1.55 && state.speed > 26) {
            o.nearMissed = true;
            const bonus = 100 * state.combo;
            state.score += bonus;
            state.comboTimer = Math.min(state.comboMax, state.comboTimer + 0.9);
            spawnSnowBurst(o.x, getTerrainHeight(o.x, o.z) + 0.5, o.z, 6, 3.2, 3.0, 0.7);
          }
        }
      }

      // -----------------------------------------------------------
      // CARVE SNOW-SPRAY PLUMES & CONTINUOUS RECESSED SKI TRACKS
      // -----------------------------------------------------------
      const carveStrength = Math.abs(state.heading) / maxHeading;
      if (state.grounded) {
        // Creamy sunlit cascading powder tail streaming off downhill outside ski edge!
        const sprayAmt = clamp(carveStrength * 1.15 + state.brake * 1.35 + 0.14, 0, 1.9);
        const speedScale = clamp((state.speed - 12) / 30, 0.2, 1.3);
        const emitProb = sprayAmt * speedScale * dt * 115;
        const nEmit = Math.floor(emitProb) + (Math.random() < (emitProb % 1) ? 1 : 0);
        const sideDir = state.heading >= 0 ? 1 : -1;
        for (let k = 0; k < Math.min(nEmit, 6); k++) {
          const isBrake = state.brake > 0.35;
          const sx = state.x + (isBrake ? (Math.random() - 0.5) * 0.9 : sideDir * (0.28 + Math.random() * 0.25));
          const spreadSide = isBrake
            ? (Math.random() - 0.5) * 7.2
            : sideDir * (2.2 + carveStrength * 5.6 + Math.random() * 2.2);
          spawnParticle(
            sx,
            state.y + 0.12 + Math.random() * 0.14,
            state.z + 0.65 + Math.random() * 0.4,
            spreadSide,
            1.1 + sprayAmt * 2.6 + Math.random() * 1.5,
            2.2 + Math.random() * 3.4,
            0.38 + sprayAmt * 0.36,
            1.15 + sprayAmt * 1.05,
            0.34 + sprayAmt * 0.26,
            8.2,
            0.97, 0.99, 1.0,
            clamp(0.46 + sprayAmt * 0.28, 0.35, 0.82)
          );
        }

        // Lay twin deep crisp sunlit carved ribbons right underneath left & right skis
        if (lastTrailZ - state.z >= 0.72) {
          const w = 0.13 + carveStrength * 0.14 + state.brake * 0.18;
          const sep = 0.26 + state.brake * 0.16;
          const cosH = Math.cos(state.heading);
          const sinH = Math.sin(state.heading);
          const lx = state.x - cosH * sep;
          const lz = state.z + sinH * sep;
          const rx = state.x + cosH * sep;
          const rz = state.z - sinH * sep;
          const off = state.onRamp ? state.y : getTerrainHeight(lx, lz);
          const offR = state.onRamp ? state.y : getTerrainHeight(rx, rz);
          pushTrackPoint(trackL, lx, off + 0.08, lz, w, false);
          pushTrackPoint(trackR, rx, offR + 0.08, rz, w, false);
          rebuildTrackRibbon(trackL);
          rebuildTrackRibbon(trackR);
          lastTrailZ = state.z;
        }
      } else {
        // Lift trails smoothly off snow so lines stay broken seamlessly during giant air!
        if (trackL.points.length > 0 && !trackL.points[trackL.points.length - 1].brk) {
          pushTrackPoint(trackL, state.x - 0.24, state.y, state.z, 0.1, true);
          pushTrackPoint(trackR, state.x + 0.24, state.y, state.z, 0.1, true);
          rebuildTrackRibbon(trackL);
          rebuildTrackRibbon(trackR);
        }
        lastTrailZ = state.z;
      }

      // Continuous tactile snow + crisp altitude wind audio
      const speedNorm = clamp((state.speed - 14) / 36, 0, 1.1);
      audio.updateContinuous(speedNorm, carveStrength, state.brake > 0.3, state.grounded, isPlaying, dt);

      // -----------------------------------------------------------
      // ANIMATE EXPRESSIVE 3D SKIER POSE
      // -----------------------------------------------------------
      skier.root.position.set(state.x, state.y, state.z);
      getTerrainNormal(state.x, state.z, _norm);
      const targetPitch = state.grounded
        ? (state.onRamp ? 0.28 : -Math.atan2(-_norm.z, _norm.y))
        : clamp(state.vy * 0.022, -0.35, 0.34);
      skier.root.rotation.x = damp(skier.root.rotation.x, targetPitch, 11, dt);
      skier.root.rotation.y = state.heading;

      // Aggressive sweeping alpine carve lean into every edge!
      const leanTarget = state.grounded ? state.heading * 0.82 : state.heading * 0.35;
      state.lean = damp(state.lean, leanTarget, 11, dt);
      skier.rig.rotation.z = state.lean;

      // Subtle bounce rhythm + tuck drop + jump knee compression
      const speedVib = state.grounded ? Math.sin(state.time * 28) * 0.016 * speedNorm : 0;
      const drop = state.tuck * 0.26 + state.squash * 0.38 + carveStrength * 0.09 + state.brake * 0.12;
      skier.torsoPivot.position.y = 0.92 - drop + speedVib;
      // Forward downhill racing egg pitch when tucking hard!
      skier.torsoPivot.rotation.x = -(0.22 + state.tuck * 0.72 + state.squash * 0.34 - state.brake * 0.26);
      // Graceful counter-rotation balancing hips naturally against sharp carvings
      skier.torsoPivot.rotation.z = -state.lean * 0.32;
      skier.head.rotation.x = 0.16 + state.tuck * 0.56;

      // Crisp athletic twin ski carving angle + classic dramatic snowplow wedge on braking!
      const wedge = state.brake * 0.42;
      skier.leftSki.rotation.y = -wedge;
      skier.rightSki.rotation.y = wedge;
      skier.leftSki.position.x = -0.22 - state.brake * 0.14;
      skier.rightSki.position.x = 0.22 + state.brake * 0.14;
      skier.leftSki.rotation.z = state.grounded ? state.lean * 0.32 : 0;
      skier.rightSki.rotation.z = state.grounded ? state.lean * 0.32 : 0;

      // Compress legs physically matching hip tuck cleanly
      const legScaleY = clamp(1 - drop * 0.65, 0.64, 1.05);
      skier.leftLeg.scale.y = legScaleY;
      skier.rightLeg.scale.y = legScaleY;

      // Expressive responsive arms (tuck tight against chest when racing, spread stylishly airborne!)
      const airSpread = state.grounded ? 0 : 0.46;
      skier.leftArm.rotation.z = -airSpread + state.tuck * 0.22 - state.lean * 0.24;
      skier.rightArm.rotation.z = airSpread - state.tuck * 0.22 - state.lean * 0.24;
      skier.leftArm.rotation.x = -state.tuck * 0.32 + (state.grounded ? 0 : -0.2);
      skier.rightArm.rotation.x = -state.tuck * 0.32 + (state.grounded ? 0 : -0.2);

      // Lively alpine wind physics dancing down our bright fluttering trail scarf
      const flutterFreq = 10 + state.speed * 0.46;
      for (let i = 0; i < skier.scarfSegs.length; i++) {
        const sg = skier.scarfSegs[i];
        sg.rotation.y = Math.sin(state.time * flutterFreq - i * 1.15) * (0.16 + i * 0.08) - state.heading * 0.18;
        sg.rotation.x = 0.12 + Math.cos(state.time * flutterFreq * 0.8 - i * 0.9) * (0.08 + i * 0.05) + (state.grounded ? 0 : clamp(-state.vy * 0.03, -0.2, 0.35));
      }

      // Airborne stylish 360 / Backflip / Frontflip pivot + brief wobble after collision
      if (state.tumbleTimer > 0) {
        skier.trickPivot.rotation.set(
          Math.sin(state.tumbleTimer * 18) * 0.35,
          state.tumbleTimer * Math.PI * 3.1,
          Math.cos(state.tumbleTimer * 16) * 0.42
        );
      } else {
        skier.trickPivot.rotation.set(state.flipAngle, state.spinAngle, 0);
      }

      // Clean rapid invulnerability flash right after collision without leaving player invisible long
      skier.root.visible = state.invulnTimer <= 0 || Math.floor(state.invulnTimer * 14) % 2 === 0;

      // Grounded alpine landing shadow right under skier (widens subtly on big jumps for crystal air depth!)
      const airH = Math.max(0, state.y - surfH);
      const shScale = 1 + clamp(airH * 0.11, 0, 1.15);
      skierShadow.position.set(state.x, surfH + 0.09, state.z);
      skierShadow.scale.set(shScale, shScale, 1);
      skierShadow.rotation.set(-Math.PI / 2 - Math.atan2(-_norm.z, _norm.y), 0, state.heading);
      skierShadow.material.opacity = clamp(0.76 - airH * 0.045, 0.24, 0.76);

      // -----------------------------------------------------------
      // WORLD ANIMATIONS (Fluttering Slalom Flags, Gold Rings, Lifts)
      // -----------------------------------------------------------
      const showBeacon = state.curBeacon > 0.32;
      for (let i = 0; i < activeGates.length; i++) {
        const g = activeGates[i];
        if (Math.abs(g.z - state.z) > 130) continue;
        // Flutter cloth ripples gently in brisk cold ridge breeze
        for (let f = 0; f < g.flags.length; f++) {
          const fl = g.flags[f];
          const pos = fl.mesh.geometry.attributes.position;
          for (let v = 0; v < pos.count; v++) {
            const lx = pos.getX(v);
            if (lx > 0.05) {
              pos.setZ(v, Math.sin(state.time * 8.5 + fl.phase + lx * 3.2) * 0.11 * lx);
            }
          }
          pos.needsUpdate = true;
        }
        // Spring snap poles cleanly right back upright after heroic World-Cup gate slap!
        for (let p = 0; p < g.poles.length; p++) {
          const pl = g.poles[p];
          if (Math.abs(pl.bend) > 0.002 || Math.abs(pl.bendVel) > 0.002) {
            pl.bendVel += (-pl.bend * 64 - pl.bendVel * 7.5) * dt;
            pl.bend += pl.bendVel * dt;
            pl.holder.rotation.x = clamp(pl.bend, -1.15, 0.8);
          }
        }
        for (let b = 0; b < g.beacons.length; b++) {
          g.beacons[b].visible = showBeacon;
        }
      }

      // Gentle gleaming bob & spin on floating gold aerial bonus rings
      for (let i = 0; i < activeRings.length; i++) {
        const rg = activeRings[i];
        if (rg.collected) continue;
        rg.mesh.rotation.y = Math.sin(state.time * 1.9 + i) * 0.28;
        rg.mesh.position.y = rg.y + Math.sin(state.time * 2.6 + i) * 0.25;
      }

      // Gentle peaceful swaying alpine gondola cars high beside the run
      for (let i = 0; i < activeLiftGondolas.length; i++) {
        const lg = activeLiftGondolas[i];
        lg.obj.rotation.z = Math.sin(state.time * 1.25 + lg.phase) * 0.055;
      }

      // Stream continuous infinite alpine run, update crisp quantized sliding mountain terrain
      updateWorldStream(state.z);
      applyAtmosphere(state.dist, false);

      const quantZ = Math.floor(state.z / TERRAIN_STEP_Z) * TERRAIN_STEP_Z;
      if (Math.abs(quantZ - lastTerrainAnchor) >= TERRAIN_STEP_Z) {
        updateTerrainMesh(quantZ, state.curSnowLit, state.curSnowSide);
        lastTerrainAnchor = quantZ;
      }

      updateParticles(dt);
      updateDust(state.x, state.y + 2, state.z, dt, state.time);

      // -----------------------------------------------------------
      // CINEMATIC DYNAMIC ALPINE CHASE CAMERA + REAL-TIME SHADOW LOCK
      // -----------------------------------------------------------
      const airLift = state.grounded ? 0 : clamp((state.y - groundH) * 0.28, 0, 3.6);
      let goalCamX, goalCamY, goalCamZ, goalLookX, goalLookY, goalLookZ, goalFov;

      if (isTitle) {
        // Breathtaking hero showcase angle revealing lush snow spray, curving piste & giant glowing alpine peaks!
        const drift = Math.sin(state.time * 0.32) * 1.8;
        goalCamX = state.x + 2.8 + drift;
        goalCamY = state.y + 4.35 + airLift * 0.5;
        goalCamZ = state.z + 9.2;
        goalLookX = getCenterX(state.z - 28) * 0.45 + state.x * 0.55;
        goalLookY = state.y - 2.9;
        goalLookZ = state.z - 26;
        goalFov = 59;
      } else {
        const followBack = 8.9 + state.tuck * 0.65 + (state.grounded ? 0 : 1.9);
        const followUp = 4.65 - state.tuck * 0.55 + airLift * 0.48 + state.squash * 0.65;
        const curveLag = -state.heading * 2.4;
        goalCamX = state.x + curveLag;
        goalCamY = state.y + followUp;
        goalCamZ = state.z + followBack;

        // Forward downhill sightline far past peaks & obstacles
        goalLookX = state.x - state.heading * 5.2;
        goalLookY = state.y - 2.35 - (state.grounded ? 0 : airLift * 0.55);
        goalLookZ = state.z - 22;
        goalFov = 58 + clamp((state.speed - 22) * 0.52, 0, 15.5) + state.tuck * 3.5 + (state.boostTimer > 0 ? 2.5 : 0);
      }

      state.camPos.x = damp(state.camPos.x, goalCamX, isTitle ? 4.5 : 8.2, dt);
      state.camPos.y = damp(state.camPos.y, goalCamY, 7.6, dt);
      state.camPos.z = damp(state.camPos.z, goalCamZ, 12.5, dt);

      // Protect camera safely clear over behind snow slopes
      const camGround = getTerrainHeight(state.camPos.x, state.camPos.z);
      if (state.camPos.y < camGround + 1.8) state.camPos.y = camGround + 1.8;

      state.camLook.x = damp(state.camLook.x, goalLookX, 8.5, dt);
      state.camLook.y = damp(state.camLook.y, goalLookY, 7.5, dt);
      state.camLook.z = damp(state.camLook.z, goalLookZ, 14, dt);

      // Dynamic thrilling high-speed micro texture + crash shake
      let sx = 0, sy = 0;
      if (state.camShake > 0.01) {
        const m = state.camShake * state.camShake * 0.72;
        sx += (Math.random() - 0.5) * m;
        sy += (Math.random() - 0.5) * m;
      }
      if (isPlaying && state.grounded && state.speed > 36) {
        const buzz = (state.speed - 36) * 0.0048;
        sx += Math.sin(state.time * 41) * buzz;
        sy += Math.cos(state.time * 37) * buzz;
      }

      camera.position.set(state.camPos.x + sx, state.camPos.y + sy, state.camPos.z);
      camera.lookAt(state.camLook);
      // Subtle graceful responsive cinematic camera tilt into steep flowing alpine carves!
      camera.rotation.z += -state.lean * (isTitle ? 0.08 : 0.14);

      state.camFov = damp(state.camFov, goalFov, 5.2, dt);
      if (Math.abs(camera.fov - state.camFov) > 0.02) {
        camera.fov = state.camFov;
        camera.updateProjectionMatrix();
      }

      // Snap colossal background mountains & crisp skydome seamlessly around climber camera
      skyDome.position.copy(camera.position);
      mountainRange.position.set(camera.position.x * 0.82, camera.position.y, camera.position.z);

      // Lock crisp rotating sun shadow frustum strictly onto our skier + foreground viewport (zero shadow popping!)
      const shadowFocusX = Math.round(state.x * 0.5) * 2;
      const shadowFocusZ = Math.round((state.z - 24) * 0.5) * 2;
      const shadowFocusY = getTerrainHeight(shadowFocusX, shadowFocusZ);
      sunLight.target.position.set(shadowFocusX, shadowFocusY, shadowFocusZ);
      sunLight.position.set(
        shadowFocusX + _sunDir.x * 110,
        shadowFocusY + _sunDir.y * 110,
        shadowFocusZ + _sunDir.z * 110
      );
      sunLight.target.updateMatrixWorld();

      // -----------------------------------------------------------
      // CRISP MINIMAL HUD UPDATE (Only while playing)
      // -----------------------------------------------------------
      if (isPlaying) {
        elScore.textContent = Math.floor(state.score).toLocaleString();
        elSpeed.innerHTML = `${Math.round(kmh)}<span>KM/H</span>`;
        elDist.textContent = `${Math.floor(state.dist).toLocaleString()} M`;

        const multActive = state.combo > 1;
        elMult.classList.toggle('active', multActive);
        elComboBar.classList.toggle('active', multActive);
        if (multActive) {
          elMult.textContent = `×${state.combo}`;
          elComboFill.style.transform = `scaleX(${clamp(state.comboTimer / state.comboMax, 0, 1)})`;
        }

        // Vivid exhilarating winter high-speed icy rim pulse past ~110 km/h
        const rush = clamp((kmh - 102) / 52, 0, 1);
        elSpeedLines.style.opacity = (rush * (0.65 + state.tuck * 0.35)).toFixed(2);
      }
    }

    /* ================================================================
       RESPONSIVE RESIZE & SILKY 60FPS MAIN LOOP
       ================================================================ */
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      partMat.uniforms.uScale.value = renderer.domElement.height * 0.55;
    });

    // Launch cleanly right into vivid sunlit live mountain downhill showcase!
    resetCourse('title');

    let lastTime = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - lastTime) * 0.001, 0.05);
      lastTime = now;

      if (state.mode !== 'paused') {
        stepSimulation(dt);
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
